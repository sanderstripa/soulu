<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';font-src 'self';style-src 'self';script-src 'self' 'wasm-unsafe-eval';worker-src 'self' blob:;connect-src 'self' https://storage.googleapis.com;img-src 'self' data: https: http:;frame-src 'self';">
  <title>Soulu</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cef-overrides.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="site-reader.css">
  <link rel="stylesheet" href="toolbar-ui.css">
<link rel="stylesheet" href="motion.css"><link rel="preload" href="fonts/Onest-Regular.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="fonts/Onest-Medium.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="fonts/Onest-SemiBold.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="typography.css"><script src="typography.js" defer></script>  <link rel="stylesheet" href="translation-ui.css">
</head>
<body data-layout="compact" data-theme="system" data-matte="true" data-address-position="center" data-extensions-position="left">
  <div class="window-drag-strip" aria-hidden="true"></div>


  <header class="compact-toolbar browser-toolbar" aria-label="Компактная панель Soulu">
    <div class="compact-toolbar-surface" data-toolbar-surface>
      <button class="compact-control sidebar-button" id="compactSidebarButton" data-i18n-title="tabs"><svg viewBox="0 0 24 24"><rect x="3.25" y="4.25" width="17.5" height="15.5" rx="2.4"/><path d="M8.7 4.7v14.6"/></svg></button>
      <button class="compact-control" id="compactBackButton" data-i18n-title="back" disabled><svg viewBox="0 0 24 24"><path d="m14.5 5.5-6 6.5 6 6.5"/></svg></button>


      <div class="compact-center-cluster">
        <div class="extension-slot compact-extension-slot extension-left" aria-label="Закреплённые расширения">
          <button class="compact-control vpn-button" id="compactVpnButton" title="VPN" aria-pressed="false"><img id="compactVpnToolbarIcon" src="vpn/icons/icon-off-32.svg" alt=""></button>
        </div>


        <div class="compact-tab-flow" id="compactTabFlow"><template id="compactTabsAnchor"></template></div>


        <div class="extension-slot compact-extension-slot extension-right" aria-label="Закреплённые расширения">
          <button class="compact-control vpn-button" id="compactVpnButtonRight" title="VPN" aria-pressed="false"><img id="compactVpnToolbarIconRight" src="vpn/icons/icon-off-32.svg" alt=""></button>
        </div>
        <button class="compact-control compact-new-tab" id="compactNewTabButton" data-i18n-title="newTab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>


      <button class="compact-control downloads-control auto-hidden" id="compactDownloadsButton" data-i18n-title="downloads" aria-expanded="false">
        <svg class="download-static" viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        <svg class="download-progress" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path class="progress-arc" d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg>
        <span class="downloads-badge" id="compactDownloadsBadge"></span>
      </button>
      <span class="compact-drag-space" aria-hidden="true"></span>
      <button class="compact-window-button" id="compactWindowMinimize" data-i18n-title="minimize"><svg viewBox="0 0 16 16"><path d="M3 8.5h10"/></svg></button>
      <button class="compact-window-button" id="compactWindowMaximize" data-i18n-title="maximize"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button>
      <button class="compact-window-button window-close" id="compactWindowClose" data-i18n-title="close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
    </div>
  </header>


  <header class="classic-toolbar browser-toolbar" aria-label="Классическая панель Soulu">
    <div class="classic-main-row" data-toolbar-surface>
      <div class="classic-navigation-left">
      <div class="left-controls">
        <button class="toolbar-button sidebar-button" id="sidebarButton" data-i18n-title="tabs"><svg viewBox="0 0 24 24"><rect x="3.25" y="4.25" width="17.5" height="15.5" rx="2.4"/><path d="M8.7 4.7v14.6"/></svg></button>
        <button class="toolbar-button" id="backButton" data-i18n-title="back" disabled><svg viewBox="0 0 24 24"><path d="m14.5 5.5-6 6.5 6 6.5"/></svg></button>
      </div>


      <div class="extension-slot classic-extension-slot extension-left" aria-label="Закреплённые расширения">
        <button class="toolbar-button vpn-button" id="vpnButton" title="VPN" aria-pressed="false"><img id="vpnToolbarIcon" src="vpn/icons/icon-off-32.svg" alt=""></button>
      </div>


      </div>
      <div class="classic-address-wrap">
        <form class="classic-address-pill" id="classicAddressForm">
          <button class="address-menu-button" type="button" id="classicPageMenu" data-i18n-title="pageMenu"><svg viewBox="0 0 20 20"><path d="M4 5.5h12M4 10h12M4 14.5h7"/></svg></button>
          <input id="classicAddress" data-i18n-placeholder="addressPlaceholder" placeholder="Поиск или адрес" autocomplete="off" spellcheck="false">
          <button class="tab-action address-favorite" type="button" id="favoritesButton" data-i18n-title="favorites"><svg viewBox="0 0 24 24"><path d="m12 3 2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 17.03l-5.5 2.89 1.05-6.12L3.1 9.47l6.15-.9L12 3Z"/></svg></button>
          <button class="tab-action classic-reload" type="button" data-reload data-i18n-title="reload"><svg class="reload-svg" viewBox="0 0 20 20"><path d="M15.4 7A6 6 0 1 0 16 12M15.5 4v3.5H12"/></svg><svg class="stop-svg" viewBox="0 0 20 20"><rect x="4.5" y="4.5" width="11" height="11" rx="2"/></svg></button>
          <button class="tab-action close-action classic-close-tab" id="classicCloseTab" type="button" data-i18n-title="close"><svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9m0-9-9 9"/></svg></button>
          <div class="suggestions classic-suggestions" id="classicSuggestions"></div>
        </form>
      </div>


      <div class="classic-navigation-right">
      <div class="extension-slot classic-extension-slot extension-right" aria-label="Закреплённые расширения">
        <button class="toolbar-button vpn-button" id="vpnButtonRight" title="VPN" aria-pressed="false"><img id="vpnToolbarIconRight" src="vpn/icons/icon-off-32.svg" alt=""></button>
      </div>


      <button class="toolbar-button downloads-control auto-hidden" id="downloadsButton" data-i18n-title="downloads" aria-expanded="false">
        <svg class="download-static" viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        <svg class="download-progress" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path class="progress-arc" d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg>
        <span class="downloads-badge" id="downloadsBadge"></span>
      </button>


      <div class="window-controls">
        <button id="windowMinimize" data-i18n-title="minimize"><svg viewBox="0 0 16 16"><path d="M3 8.5h10"/></svg></button>
        <button id="windowMaximize" data-i18n-title="maximize"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button>
        <button id="windowClose" class="window-close" data-i18n-title="close"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
      </div>
      </div>
    </div>


    <div class="tabs-zone" data-toolbar-surface>
      <div class="tab-strip" id="tabStrip" role="tablist"></div>
      <button class="toolbar-button tabs-new-button" id="newTabButton" data-i18n-title="newTab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="classic-tabs-drag" aria-hidden="true"></span>
    </div>
  </header>


  <aside class="sidebar" id="sidebar"><div class="panel-heading"><div><strong data-i18n="tabs">Вкладки</strong><small id="sidebarCount"></small></div><button id="sidebarNewTab">+</button></div><div id="sidebarTabs"></div></aside>
  <aside class="side-panel" id="favoritesPanel"><div class="panel-heading"><div><strong data-i18n="favorites">Избранное</strong><small data-i18n="savedPages">Сохранённые страницы</small></div><button id="addFavoriteButton">☆</button></div><div id="favoritesList"></div></aside>
  <aside class="side-panel downloads-panel" id="downloadsPanel"><div class="panel-heading"><div><strong data-i18n="downloads">Загрузки</strong><small data-i18n="recentDownloads">Текущие и недавние</small></div></div><div id="downloadsList"></div></aside>
  <aside class="vpn-panel" id="vpnPanel"><iframe id="vpnFrame" src="vpn/popup.html" title="VPN"></iframe></aside>


  <script src="motion.js"></script><script src="cef-bridge.js"></script>
  <script src="renderer.js"></script>
  <script src="cef-enhancements.js"></script>
  <script src="navigation.js"></script>
  <script src="reader-safe.js"></script>
  <script src="site-reader.js"></script>
  <script src="third_party/bergamot-runtime.js"></script>
  <script src="third_party/tinyld.js"></script>
  <script src="translation-models.js"></script>
  <script src="translation-service.js"></script>
  <script src="third_party/qrcode.js"></script>
  <script src="third_party/qrcode-utf8.js"></script>
  <script src="translation-ui.js"></script>
</body>
</html>
