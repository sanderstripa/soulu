<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; connect-src https://geocoding-api.open-meteo.com https://api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Soulu</title>
  <link rel="stylesheet" href="home.css">
  <script defer src="home.js"></script>
  <link rel="preload" href="fonts/Onest-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Onest-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Onest-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="typography.css">
  <script src="typography.js" defer></script>
</head>
<body>
  <div id="utilities" aria-label="Быстрые функции / Quick utilities">
    <section id="weather">
      <button id="weatherToggle" type="button" aria-expanded="false" aria-controls="weatherDetail">
        <span id="weatherIcon" aria-hidden="true">☁</span>
        <span id="weatherTemp"></span>
        <span id="weatherCity">Погода</span>
      </button>
      <div id="weatherDetail" class="popover weather-popover" hidden>
        <div class="weather-current">
          <span id="weatherDetailIcon" class="weather-big-icon" aria-hidden="true">☁</span>
          <div>
            <strong id="weatherDetailTemp">—</strong>
            <span id="weatherCondition">Погода</span>
          </div>
          <strong id="weatherDetailCity">—</strong>
        </div>
        <p id="weatherMeta" class="weather-meta"></p>
        <p id="weatherMessage" class="weather-message"></p>
        <div id="weatherHourly" class="weather-strip" aria-label="Почасовой прогноз / Hourly forecast"></div>
        <div id="weatherDaily" class="weather-strip daily" aria-label="Прогноз на неделю / Weekly forecast"></div>
        <div class="weather-city-editor">
          <label class="sr-only" for="city">Город / City</label>
          <input id="city" maxlength="100" autocomplete="off" placeholder="Город">
          <button id="saveCity" type="button">Сохранить</button>
        </div>
      </div>
    </section>

    <section id="shortcuts">
      <button id="launcherToggle" type="button" aria-expanded="false" aria-controls="launcherPanel" aria-label="Избранные сайты / Favorite sites">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="5" r="1.55"/><circle cx="12" cy="5" r="1.55"/><circle cx="19" cy="5" r="1.55"/>
          <circle cx="5" cy="12" r="1.55"/><circle cx="12" cy="12" r="1.55"/><circle cx="19" cy="12" r="1.55"/>
          <circle cx="5" cy="19" r="1.55"/><circle cx="12" cy="19" r="1.55"/><circle cx="19" cy="19" r="1.55"/>
        </svg>
      </button>
      <div id="launcherPanel" class="popover launcher-popover" hidden>
        <div id="links"></div>
        <p id="shortcutsEmpty" class="empty-note" hidden>Добавьте избранные сайты в настройках Soulu.</p>
      </div>
      <button id="add" class="legacy-control" type="button">+ Добавить ссылку</button>
    </section>
  </div>

  <main>
    <div class="hero">
      <div id="logo"><img src="branding/soulu-128.png" alt=""><span class="sr-only">Soulu</span></div>
      <div id="searchWrap">
        <form id="search">
          <div id="engineToggle" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="engineMenu">
            <span id="engineIcon" class="engine-icon google-mark" aria-hidden="true">G</span>
            <span id="engineLabel">Google</span>
          </div>
          <span class="search-divider" aria-hidden="true"></span>
          <label class="sr-only" for="query">Введите поисковый запрос или URL</label>
          <input id="query" placeholder="Введите поисковый запрос или URL" autocomplete="off" spellcheck="false">
          <button id="voice" type="button" aria-label="Голосовой ввод / Voice input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4Z"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
          </button>
        </form>
        <div id="engineMenu" class="popover engine-popover" role="listbox" hidden>
          <button type="button" class="engine-option selected" data-engine="google" role="option" aria-selected="true">
            <span class="engine-icon google-mark" aria-hidden="true">G</span><span>Google</span><span class="engine-check">✓</span>
          </button>
          <button type="button" class="engine-option" data-engine="perplexity" role="option" aria-selected="false">
            <span class="engine-icon perplexity-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 8h18M3 16h18M7 3l10 5-10 8 10 5M17 3 7 8l10 8-10 5"/></svg></span><span>Perplexity</span><span class="engine-check"></span>
          </button>
        </div>
      </div>
      <p id="error" role="status"></p>
    </div>
  </main>

  <button id="customize" class="legacy-control" type="button" aria-label="Настроить страницу / Customize">⚙</button>
  <dialog id="preferences" class="legacy-control"><form method="dialog"><h2>Страница Soulu</h2><div id="toggles"></div><button>Готово / Done</button></form></dialog>
  <dialog id="editor" class="legacy-control"><form id="shortcutForm"><h2 id="editorTitle">Быстрая ссылка</h2><label>Название / Name<input id="shortcutName" required maxlength="80"></label><label>URL<input id="shortcutUrl" required maxlength="4096" placeholder="https://example.com"></label><p id="editorError" role="status"></p><div class="actions"><button type="button" id="cancel">Отмена / Cancel</button><button>Сохранить / Save</button></div></form></dialog>
</body>
</html>
