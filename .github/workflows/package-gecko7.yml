name: Package and publish verified Soulu Gecko Preview 7
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/package-gecko7.yml']
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact verified build and evidence
        shell: pwsh
        run: |
          $run = gh run view 41793966683 --json conclusion,headSha | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.headSha -ne '5cda9c644f157b256502c1ab068dc7c7642ff7a0') { throw 'Verified source run mismatch' }
          gh run download 41793966683 -n gecko7-verified-build-inputs -D gecko-out
          if ($LASTEXITCODE -ne 0) { throw 'Verified build download failed' }
          gh run download 41793966683 -n gecko7-diagnostic-evidence -D evidence
          if ($LASTEXITCODE -ne 0) { throw 'Evidence download failed' }
          python -c "import json,pathlib; p=pathlib.Path('evidence'); reports=['preview7.json','extensions7.json','firstframe7.json','resize7.json']; assert all(json.loads((p/f).read_text())['passed'] for f in reports); b=json.loads(pathlib.Path('gecko-out/BUILD.json').read_text()); assert b['name']=='Soulu Gecko Preview 7' and b['soulu_source']=='5cda9c644f157b256502c1ab068dc7c7642ff7a0'"
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance report validation failed' }
          if ((Get-Item gecko-out/Soulu.exe).VersionInfo.ProductVersion -ne '0.7.0.0') { throw 'Launcher is not Preview 7' }
          if ((Get-Item gecko-out/Soulu.exe).VersionInfo.FileDescription -ne 'Soulu Gecko Preview 7') { throw 'Launcher product identity mismatch' }
          New-Item -ItemType Directory -Force gecko-out/Preview7-validation | Out-Null
          Copy-Item evidence/*.json gecko-out/Preview7-validation/
          Copy-Item gecko/docs/PREVIEW7-RESULTS.md gecko-out/
          python -m pip install marionette_driver
      - name: Package and launch extracted Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path gecko-out/* -DestinationPath Soulu-Gecko-Preview-7-win64.zip -CompressionLevel Optimal
          python gecko/tests/zip_smoke.py Soulu-Gecko-Preview-7-win64.zip zip-check
          if ($LASTEXITCODE -ne 0) { throw 'Extracted ZIP launch failed' }
          (Get-FileHash Soulu-Gecko-Preview-7-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-Gecko-Preview-7-win64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko7-package-evidence
          path: zip-check/
      - name: Publish verified portable browser
        shell: pwsh
        run: |
          gh release create gecko-preview-7 Soulu-Gecko-Preview-7-win64.zip SHA256SUMS.txt zip-check/zip-smoke.json evidence/preview7.json evidence/extensions7.json evidence/firstframe7.json evidence/resize7.json --target $env:GITHUB_SHA --title "Soulu Gecko Preview 7" --prerelease --notes-file gecko/docs/PREVIEW7-RESULTS.md
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
