name: Check installer version regression against the old published EXE
on:
  push:
    branches: [codex/installer-version-preflight]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test client
        run: python -m pip install websocket-client pillow
      - name: Download the exact old installer that displays 67
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download beta-1.0.70 --repo sanderstripa/soulu --pattern Soulu-Beta-1.0.70-x64.exe --dir old
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if((Get-FileHash old/Soulu-Beta-1.0.70-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne '20907420fe2c9b61a5e9808c2561cdd751c260b39875be6ebe3592342b581d02'){throw 'Wrong old installer'}
      - name: Inspect WebView2 runtime availability
        shell: pwsh
        run: |
          Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application" -Directory -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application" -Directory -ErrorAction SilentlyContinue | Select-Object Name
      - name: Require the new actual-window checker to reject its real version 67
        shell: pwsh
        run: |
          $output=& python scripts/test-installer-version-ui.py old/Soulu-Beta-1.0.70-x64.exe artifacts/old-installer-version.json 2>&1
          $code=$LASTEXITCODE
          $text=$output | Out-String
          Write-Host $text
          if($code -eq 0 -or $text -notmatch 'actualFooter' -or $text -notmatch '1\.0\.67-beta'){throw 'Checker did not observe and reject the actual stale footer'}
          Write-Host 'PASS: actual packaged old installer was rejected specifically for displaying version67 instead of canonical71'
          $global:LASTEXITCODE=0
