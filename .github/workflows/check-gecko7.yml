name: Preview 7 first functional frame and persistence checks
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/check-gecko7.yml']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Assemble Preview 7 with accepted engine and accelerated speech
        shell: pwsh
        run: |
          gh release download gecko-preview-5-update-1 -p Soulu-Gecko-Preview-5-Update-1-win64.zip -D accepted
          if ((Get-FileHash accepted/Soulu-Gecko-Preview-5-Update-1-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '88b71cb56199e92fcaf36a2063da92fd1576e1e404094ece5205f665ead17cac') { throw 'Base checksum mismatch' }
          Expand-Archive accepted/Soulu-Gecko-Preview-5-Update-1-win64.zip gecko-out
          python gecko/tests/overlay7.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource overlay failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE -ne 0) { throw 'Version resource failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Soulu.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher failed' }
          Pop-Location
          python -m pip install marionette_driver pillow psutil websocket-client
      - name: Run real editor, Home, version, routing and pixel checks
        run: python gecko/tests/preview7.py gecko-out/runtime/firefox.exe gecko7-checks
      - name: Observe first actual visible native window
        if: always()
        run: python gecko/tests/firstframe7.py gecko-out/runtime/firefox.exe gecko7-checks
      - name: Check actual Windows live resize edges
        if: always()
        run: python gecko/tests/resize7.py gecko-out/runtime/firefox.exe gecko7-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko7-diagnostic-evidence
          path: gecko7-checks/
