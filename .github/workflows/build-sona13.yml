name: Build and publish Sona 0.13.0 Preview
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/build-sona13.yml']
permissions:
  contents: write
  actions: write
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cancel superseded Preview 13 checks
        shell: pwsh
        run: |
          $runs = gh run list --workflow build-sona13.yml --branch gecko-preview --limit 30 --json databaseId,status | ConvertFrom-Json
          foreach ($old in $runs) { if ([long]$old.databaseId -lt [long]$env:GITHUB_RUN_ID -and $old.status -in @('in_progress','queued')) { gh run cancel $old.databaseId } }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Restore accepted Preview 12 and apply requested Preview 13 fixes
        id: assemble
        shell: pwsh
        run: |
          $run = gh run view 41987624667 --json conclusion,headSha | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.headSha -ne '10d65165e4b899c2b742cef78ee6508c4edd9b3b') { throw 'Preview 12 provenance mismatch' }
          gh run download 41987624667 -n soul12-verified-installer -D preview12-input
          if ($LASTEXITCODE) { throw 'Verified Preview 12 download failed' }
          python gecko/prepare-preview13.py
          if ($LASTEXITCODE) { throw 'Preview 13 assembly failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Sona.exe .
          if ($LASTEXITCODE) { throw 'Launcher compilation failed' }
          Pop-Location
          python gecko/brand-engine.py
          if ($LASTEXITCODE) { throw 'Engine branding failed' }
          New-Item -ItemType Directory -Force sona13-checks | Out-Null
          Copy-Item gecko-out/windows-brand-audit.json,gecko-out/default-bookmarks-audit.json sona13-checks
          python -c "import json; r=json.load(open('gecko-out/windows-brand-audit.json')); assert r and all(x['iconGroupsMatchSona'] for x in r); assert json.load(open('gecko-out/default-bookmarks-audit.json'))['disabled']"
          if ($LASTEXITCODE) { throw 'Branding/default bookmark audit failed' }
          python -m pip install marionette_driver pillow psutil websocket-client
      - name: Verify requested welcome, extensions and restart scenarios
        run: python gecko/tests/preview13.py gecko-out/engine/SonaEngine.exe sona13-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sona13-browser-evidence
          path: sona13-checks/
      - name: Build Sona 0.13.0 Preview installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Sona-0.13.0-Preview-Setup-win64.exe
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ((Get-Item Sona-0.13.0-Preview-Setup-win64.exe).VersionInfo.ProductVersion -ne '0.13.0.0') { throw 'Installer version mismatch' }
      - name: Verify clean installation, first launch, upgrade and removal
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python gecko/tests/installer13.py Sona-0.13.0-Preview-Setup-win64.exe sona13-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sona13-evidence
          path: sona13-checks/
      - uses: actions/upload-artifact@v4
        with:
          name: sona13-verified-installer
          path: |
            Sona-0.13.0-Preview-Setup-win64.exe
            Sona-0.13.0-Preview-Setup-win64.exe.build.json
      - name: Publish tested Sona 0.13.0 Preview installer
        shell: pwsh
        run: |
          python -c "import json,pathlib; paths=['preview13.json','installer13.json']; assert all(json.loads((pathlib.Path('sona13-checks')/p).read_text())['passed'] for p in paths)"
          if ($LASTEXITCODE) { throw 'Acceptance reports not green' }
          (Get-FileHash Sona-0.13.0-Preview-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Sona-0.13.0-Preview-Setup-win64.exe' | Set-Content SHA256SUMS.txt
          $branchHead = gh api repos/sanderstripa/soulu/git/ref/heads/gecko-preview --jq '.object.sha'
          if ($branchHead.Trim() -ne $env:GITHUB_SHA) { throw 'A newer source revision superseded this build' }
          gh release create sona-preview-13 Sona-0.13.0-Preview-Setup-win64.exe Sona-0.13.0-Preview-Setup-win64.exe.build.json SHA256SUMS.txt sona13-checks/preview13.json sona13-checks/installer13.json --target $env:GITHUB_SHA --title 'Sona 0.13.0 Preview' --prerelease --notes-file gecko/docs/PREVIEW13-RESULTS.md
          if ($LASTEXITCODE) { throw 'Release publication failed' }

# Verify native automatic add-on routing and themed control painting.

# Theme choices use Sona buttons, without a platform menulist surface.
