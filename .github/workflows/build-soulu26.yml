name: Build and publish Soulu Preview 1.160.30
on:
  push:
    branches: [gecko-preview, main]
    paths: ['.github/workflows/build-soulu26.yml','gecko/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: soulu-gecko-preview-30
  cancel-in-progress: true
jobs:
  windows:
    if: "!contains(github.event.head_commit.message, '[verified-promotion]')"
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Verify real Windows mutex ownership and closed-session recovery
        working-directory: gecko/launcher
        run: |
          Push-Location ../..
          node gecko/tests/settings-unicode.cjs
          Pop-Location
          if ($LASTEXITCODE) { throw "Settings Unicode regression failed" }
          gofmt -w main.go session_windows.go session_windows_test.go
          go test -v -count=1 .
          if ($LASTEXITCODE) { throw 'Launcher ownership checks failed' }
      - name: Restore published Preview 17 and apply requested Preview 28 fixes
        id: assemble
        shell: pwsh
        run: |
          gh run download 42055551760 -n soulu17-verified-installer -D preview17-input
          if ($LASTEXITCODE) { throw 'Preview 17 download failed' }
          python -m pip install pillow
          python gecko/prepare-preview26.py
          if ($LASTEXITCODE) { throw 'Preview 28 assembly failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Soulu.exe .
          if ($LASTEXITCODE) { throw 'Launcher compilation failed' }
          Pop-Location
          python gecko/brand-engine.py
          if ($LASTEXITCODE) { throw 'Engine branding failed' }
          New-Item -ItemType Directory -Force soulu30-checks | Out-Null
          Copy-Item gecko-out/windows-brand-audit.json,gecko-out/default-bookmarks-audit.json,gecko-out/internal-branding-audit.json soulu30-checks
          python -c "import json; r=json.load(open('gecko-out/windows-brand-audit.json')); assert r and all(x['iconGroupsMatchSoulu'] for x in r); assert json.load(open('gecko-out/default-bookmarks-audit.json'))['disabled']"
          if ($LASTEXITCODE) { throw 'Branding/default bookmark audit failed' }
          python -m pip install marionette_driver pillow psutil websocket-client
          python gecko/tests/adblock-update.py gecko-out/engine/soulu/adblock/soulu_adblock.dll soulu30-checks/adblock-atomic.json
          if ($LASTEXITCODE) { throw 'Adblock atomic update verification failed' }
      - name: Verify all packaged executable and UI icon resources
        shell: pwsh
        run: |
          python scripts/verify-branding.py --binary gecko-out/Soulu.exe
          if ($LASTEXITCODE) { throw 'Launcher icon verification failed' }
          Get-ChildItem gecko-out/engine -Filter *.exe | ForEach-Object {
            python scripts/verify-branding.py --binary $_.FullName
            if ($LASTEXITCODE) { throw "Engine icon verification failed: $_" }
          }
          python gecko/tests/icon-assets29.py gecko-out
          if ($LASTEXITCODE) { throw 'Packaged icon alias audit failed' }
      - name: Build Soulu Preview 1.160.30 installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soulu-1.160.30-Preview-x64.exe
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ((Get-Item Soulu-1.160.30-Preview-x64.exe).VersionInfo.ProductVersion -ne '1.160.30.0') { throw 'Installer version mismatch' }
      - name: Verify installer executable icon
        run: python scripts/verify-branding.py --binary Soulu-1.160.30-Preview-x64.exe
      - name: Verify installed toolbar, incognito, twelve restarts, upgrade and removal
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python gecko/tests/installer26.py Soulu-1.160.30-Preview-x64.exe soulu30-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soulu30-evidence
          path: soulu30-checks/
      - uses: actions/upload-artifact@v4
        with:
          name: soulu30-verified-installer
          path: |
            Soulu-1.160.30-Preview-x64.exe
            Soulu-1.160.30-Preview-x64.exe.build.json
      - name: Publish tested Soulu Preview 1.160.30 installer
        shell: pwsh
        run: |
          python -c "import json,pathlib; paths=['restart18.json','installer26.json']; assert all(json.loads((pathlib.Path('soulu30-checks')/p).read_text())['passed'] for p in paths)"
          if ($LASTEXITCODE) { throw 'Acceptance reports not green' }
          (Get-FileHash Soulu-1.160.30-Preview-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-1.160.30-Preview-x64.exe' | Set-Content SHA256SUMS.txt
          $branchHead = gh api "repos/sanderstripa/soulu/git/ref/heads/$env:GITHUB_REF_NAME" --jq '.object.sha'
          if ($branchHead.Trim() -ne $env:GITHUB_SHA) { throw 'A newer source revision superseded this build' }
          gh release view soulu-preview-1.160.30 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload soulu-preview-1.160.30 Soulu-1.160.30-Preview-x64.exe SHA256SUMS.txt --clobber
            if ($LASTEXITCODE) { throw 'Release asset replacement failed' }
            gh api -X PATCH repos/sanderstripa/soulu/git/refs/tags/soulu-preview-1.160.30 -f sha=$env:GITHUB_SHA -F force=true
            if ($LASTEXITCODE) { throw 'Verified release tag update failed' }
            gh release edit soulu-preview-1.160.30 --latest
          } else {
            gh release create soulu-preview-1.160.30 Soulu-1.160.30-Preview-x64.exe SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Soulu Preview 1.160.30' --notes 'Redrawn blue ribbon and cards icon with full-size optical bounds and no inset padding. Taskbar frames enlarged by 7–14 percent. All product icons replaced at 16–1024 px, including launcher, engine, installer, uninstaller, desktop, Start menu, pinned shortcuts and internal browser pages. Automated installation, upgrade and restart checks passed.'
          }
          if ($LASTEXITCODE) { throw 'Release publication failed' }


