name: Build and publish Soulu Preview 1.160.27
on:
  push:
    branches: [gecko-preview, main]
    paths: ['.github/workflows/build-soulu26.yml','gecko/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: soulu-gecko-preview-27
  cancel-in-progress: true
jobs:
  windows:
    if: "!contains(github.event.head_commit.message, '[verified-promotion]')"
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Verify real Windows mutex ownership and closed-session recovery
        working-directory: gecko/launcher
        run: |
          gofmt -w main.go session_windows.go session_windows_test.go
          go test -v -count=1 .
          if ($LASTEXITCODE) { throw 'Launcher ownership checks failed' }
      - name: Restore published Preview 17 and apply requested Preview 27 fixes
        id: assemble
        shell: pwsh
        run: |
          gh run download 42055551760 -n soulu17-verified-installer -D preview17-input
          if ($LASTEXITCODE) { throw 'Preview 17 download failed' }
          python -m pip install pillow
          python gecko/prepare-preview26.py
          if ($LASTEXITCODE) { throw 'Preview 27 assembly failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Soulu.exe .
          if ($LASTEXITCODE) { throw 'Launcher compilation failed' }
          Pop-Location
          python gecko/brand-engine.py
          if ($LASTEXITCODE) { throw 'Engine branding failed' }
          New-Item -ItemType Directory -Force soulu27-checks | Out-Null
          Copy-Item gecko-out/windows-brand-audit.json,gecko-out/default-bookmarks-audit.json,gecko-out/internal-branding-audit.json soulu27-checks
          python -c "import json; r=json.load(open('gecko-out/windows-brand-audit.json')); assert r and all(x['iconGroupsMatchSoulu'] for x in r); assert json.load(open('gecko-out/default-bookmarks-audit.json'))['disabled']"
          if ($LASTEXITCODE) { throw 'Branding/default bookmark audit failed' }
          python -m pip install marionette_driver pillow psutil websocket-client
          python gecko/tests/adblock-update.py gecko-out/engine/soulu/adblock/soulu_adblock.dll soulu27-checks/adblock-atomic.json
          if ($LASTEXITCODE) { throw 'Adblock atomic update verification failed' }
      - name: Build Soulu Preview 1.160.27 installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soulu-1.160.27-Preview-x64.exe
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ((Get-Item Soulu-1.160.27-Preview-x64.exe).VersionInfo.ProductVersion -ne '1.160.27.0') { throw 'Installer version mismatch' }
      - name: Verify installed toolbar, incognito, twelve restarts, upgrade and removal
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python gecko/tests/installer26.py Soulu-1.160.27-Preview-x64.exe soulu27-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soulu27-evidence
          path: soulu27-checks/
      - uses: actions/upload-artifact@v4
        with:
          name: soulu27-verified-installer
          path: |
            Soulu-1.160.27-Preview-x64.exe
            Soulu-1.160.27-Preview-x64.exe.build.json
      - name: Publish tested Soulu Preview 1.160.27 installer
        shell: pwsh
        run: |
          python -c "import json,pathlib; paths=['restart18.json','installer26.json']; assert all(json.loads((pathlib.Path('soulu27-checks')/p).read_text())['passed'] for p in paths)"
          if ($LASTEXITCODE) { throw 'Acceptance reports not green' }
          (Get-FileHash Soulu-1.160.27-Preview-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-1.160.27-Preview-x64.exe' | Set-Content SHA256SUMS.txt
          $branchHead = gh api "repos/sanderstripa/soulu/git/ref/heads/$env:GITHUB_REF_NAME" --jq '.object.sha'
          if ($branchHead.Trim() -ne $env:GITHUB_SHA) { throw 'A newer source revision superseded this build' }
          gh release view soulu-preview-1.160.27 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload soulu-preview-1.160.27 Soulu-1.160.27-Preview-x64.exe SHA256SUMS.txt --clobber
            if ($LASTEXITCODE) { throw 'Release asset replacement failed' }
            gh api -X PATCH repos/sanderstripa/soulu/git/refs/tags/soulu-preview-1.160.27 -f sha=$env:GITHUB_SHA -F force=true
            if ($LASTEXITCODE) { throw 'Verified release tag update failed' }
            gh release edit soulu-preview-1.160.27 --latest
          } else {
            gh release create soulu-preview-1.160.27 Soulu-1.160.27-Preview-x64.exe SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Soulu Preview 1.160.27' --notes 'Unified installer light/dark appearance, centered caption feedback and canonical version 1.160.27 in installer and application. Existing browser functionality retained.'
          }
          if ($LASTEXITCODE) { throw 'Release publication failed' }


