name: Gecko source checkpoint
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/gecko-source-checkpoint.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create reproducible source snapshot
        run: git archive --format=zip HEAD > sona-gecko-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sona-gecko-source
          path: sona-gecko-source.zip
