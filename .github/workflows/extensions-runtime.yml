name: Verify extensions against compiled native candidate
on:
  push:
    branches: [codex/extensions-acceptance]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: soulu-extensions-acceptance
  cancel-in-progress: true
jobs:
  extensions:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: 1
      SOULU_TEST_STORE_INSTALL: 1
      SOULU_REGRESSION_SKIP_FIRST_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Soulu-cef-candidate-7b6f3ad8b4fb32fa2babda264c5c6c3d76bd266e
          run-id: 41348303289
          github-token: ${{ github.token }}
          path: runtime
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Assemble pinned runtime
        shell: pwsh
        run: |
          $url='https://cef-builds.spotifycdn.com/cef_binary_156.0.14%2Bg4fa4ab5%2Bchromium-156.0.8078.48_windows64.tar.bz2'
          Invoke-WebRequest $url -OutFile cef.tar.bz2
          if ((Get-FileHash cef.tar.bz2 -Algorithm SHA1).Hash.ToLowerInvariant() -cne '7a1049f0facf3b6ce9efc4d683cf1bac72691ba6') { throw 'CEF distribution digest mismatch' }
          New-Item -ItemType Directory -Force cef-runtime | Out-Null
          tar -xjf cef.tar.bz2 -C cef-runtime
          if ($LASTEXITCODE -ne 0) { throw 'CEF extraction failed' }
          $distribution=Get-ChildItem cef-runtime -Directory | Select-Object -First 1
          Copy-Item "$($distribution.FullName)/Release/*" runtime -Force
          Copy-Item "$($distribution.FullName)/Resources/*" runtime -Recurse -Force
          Copy-Item ui/* runtime/ui/ -Recurse -Force
          Copy-Item vpn runtime/ -Recurse -Force
          ./scripts/prepare-vpn-components.ps1 -Destination "$env:GITHUB_WORKSPACE/runtime/vpn/native-host"
          python -m pip install --disable-pip-version-check websocket-client pillow pywinauto
      - name: Test real unpacked extension lifecycle
        shell: pwsh
        run: python scripts/test-cef-extensions.py "$env:GITHUB_WORKSPACE/runtime/Soulu.exe" artifacts/extensions-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soulu-extensions-acceptance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
