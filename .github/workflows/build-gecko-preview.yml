name: Build Soulu Gecko Preview
on:
  push:
    branches: [gecko-preview]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Rust toolchain for the adblock engine
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Assemble pinned Gecko runtime and Soulu chrome
        shell: pwsh
        run: |
          python gecko/build.py --platform win64 --output gecko-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python gecko/build-adblock.py gecko-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python gecko/prepare-vot.py gecko-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python gecko/prepare-vpn.py gecko-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Speech components (best effort)
        continue-on-error: true
        run: python gecko/speech/prepare.py gecko-out
      - name: Build launcher
        shell: pwsh
        run: |
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE -ne 0) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o '../../gecko-out/Soulu.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          Pop-Location
      - name: Build installer
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soulu-Gecko-Preview-9-Setup-win64.exe *>&1 | Tee-Object installer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Report installer failure in an issue
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$env:GITHUB_REPOSITORY" --title "CI: gecko installer build failed (run $env:GITHUB_RUN_ID)" --body-file installer-build.log
      - name: Preview 9 acceptance checks
        run: python gecko/tests/preview9.py gecko-out
      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash Soulu-Gecko-Preview-9-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Soulu-Gecko-Preview-9-Setup-win64.exe" | Out-File SHA256SUMS.txt -Encoding utf8
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gecko-preview-9
          name: Soulu Gecko Preview 9
          body: |
            Soulu Gecko Preview 9

            Fixes in this build:
            - First-run welcome import now reliably opens the migration wizard instead of bouncing back to Settings.
            - Settings -> Profile -> Import works again (hook now calls the native import action).
            - No second browser: Firefox shell-integration, updater and crash-reporting binaries are removed from the runtime, and stale Firefox registry registrations are cleaned up at startup.
            - Startup no longer hangs on a dead UI: a native fallback restores the classic toolbar if the shell UI is not ready in 8 seconds, eliminating the frozen stub windows.
            - Faster startup: ad-block initialization no longer blocks first launch.
          files: |
            Soulu-Gecko-Preview-9-Setup-win64.exe
            Soulu-Gecko-Preview-9-Setup-win64.exe.build.json
            SHA256SUMS.txt
