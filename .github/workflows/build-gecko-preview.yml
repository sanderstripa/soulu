name: Build Soulu Gecko Preview
on:
  push:
    branches: [gecko-preview]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Rust toolchain for the adblock engine
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Assemble pinned Gecko runtime and Soulu chrome
        shell: pwsh
        run: |
          $steps = @(
            @('gecko/build.py','--platform','win64','--output','gecko-out'),
            @('gecko/purge-firefox-integration.py','gecko-out'),
            @('gecko/build-adblock.py','gecko-out'),
            @('gecko/prepare-vot.py','gecko-out'),
            @('gecko/prepare-vpn.py','gecko-out')
          )
          foreach ($s in $steps) {
            $ok = $false
            foreach ($attempt in 1..2) {
              python $s
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "step $($s[0]) failed, retrying"
            }
            if (-not $ok) { throw "Assemble failed at $($s[0])" }
          }
      - name: Speech components (best effort)
        continue-on-error: true
        run: python gecko/speech/prepare.py gecko-out
      - name: Build launcher
        shell: pwsh
        run: |
          Push-Location gecko/launcher
          go run github.com/josephspurrior/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE -ne 0) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o '../../gecko-out/Soulu.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          Pop-Location
      - name: Build installer
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soulu-Gecko-Preview-9-Setup-win64.exe *>&1 | Tee-Object installer-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Preview 9 acceptance checks
        shell: pwsh
        run: |
          python gecko/tests/preview9.py gecko-out *>&1 | Tee-Object acceptance.log
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance failed' }
      - name: Report failure in an issue with full logs
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view $env:GITHUB_RUN_ID --repo "$env:GITHUB_REPOSITORY" --log > ci-full.log
          "--- full run log (tail) ---" | Set-Content failure-report.md -Encoding utf8NoBOM
          Get-Content ci-full.log -Tail 500 | Add-Content failure-report.md
          gh issue create --repo "$env:GITHUB_REPOSITORY" --title "CI: Preview 9 build failed (run $env:GITHUB_RUN_ID)" --body-file failure-report.md

      - name: Checksums
        if: success()
        shell: pwsh
        run: |
          $hash = (Get-FileHash Soulu-Gecko-Preview-9-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Soulu-Gecko-Preview-9-Setup-win64.exe" | Out-File SHA256SUMS.txt -Encoding utf8
      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gecko-preview-9
          name: Soulu Gecko Preview 9
          body: |
            Soulu Gecko Preview 9

            Fixes in this build:
            - First-run welcome import now reliably opens the migration wizard instead of bouncing back to Settings.
            - Settings -> Profile -> Import works again (hook now calls the native import action).
            - No second browser: Firefox shell-integration, updater and crash-reporting binaries are removed from the runtime, and stale Firefox registry registrations are cleaned up at startup.
            - Startup no longer hangs on a dead UI: a native fallback restores the classic toolbar if the shell UI is not ready in 8 seconds, eliminating the frozen stub windows.
            - Faster startup: ad-block initialization no longer blocks first launch.
          files: |
            Soulu-Gecko-Preview-9-Setup-win64.exe
            Soulu-Gecko-Preview-9-Setup-win64.exe.build.json
            SHA256SUMS.txt
