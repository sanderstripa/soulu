name: Validate UI against verified native candidate
on:
  push:
    branches: [codex/browser-components]
    paths: ['ui/**', 'scripts/fixtures/**', 'scripts/test-cef-next-ui.py', 'scripts/test-cef-site-reader.py', 'scripts/test-cef-ui.py', 'scripts/test-cef-video-translation.py', '.github/workflows/check-ui-runtime.yml']
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: soulu-ui-candidate
  cancel-in-progress: true
jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for this commit's compiled native candidate
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline=(Get-Date).AddMinutes(15)
          $ready=$false
          while ((Get-Date) -lt $deadline) {
            $runs=gh api "repos/sanderstripa/soulu/actions/runs?head_sha=$env:GITHUB_SHA&per_page=10" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate workflow' }
            $run=$runs.workflow_runs | Where-Object path -eq '.github/workflows/check-components.yml' | Select-Object -First 1
            if ($run) {
              $list=gh api "repos/sanderstripa/soulu/actions/runs/$($run.id)/artifacts" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read candidate artifacts' }
              if (@($list.artifacts | Where-Object name -eq "Soulu-cef-candidate-$env:GITHUB_SHA").Count -gt 0) {
                "run=$($run.id)" >> $env:GITHUB_OUTPUT
                $ready=$true
                break
              }
              if ($run.status -eq 'completed' -and $run.conclusion -ne 'success') { throw 'Fresh native candidate build failed' }
            }
            Start-Sleep -Seconds 10
          }
          if (!$ready) { throw 'Matching native candidate was not produced' }
      - uses: actions/download-artifact@v4
        with:
          name: Soulu-cef-candidate-${{ github.sha }}
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: runtime
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Assemble verified CEF runtime and current interface
        shell: pwsh
        run: |
          $url='https://cef-builds.spotifycdn.com/cef_binary_156.0.14%2Bg4fa4ab5%2Bchromium-156.0.8078.48_windows64.tar.bz2'
          Invoke-WebRequest $url -OutFile cef.tar.bz2
          if ((Get-FileHash cef.tar.bz2 -Algorithm SHA1).Hash.ToLowerInvariant() -cne '7a1049f0facf3b6ce9efc4d683cf1bac72691ba6') { throw 'CEF distribution digest mismatch' }
          New-Item -ItemType Directory -Force cef-runtime | Out-Null
          tar -xjf cef.tar.bz2 -C cef-runtime
          if ($LASTEXITCODE -ne 0) { throw 'CEF extraction failed' }
          $distribution=Get-ChildItem cef-runtime -Directory | Select-Object -First 1
          Copy-Item "$($distribution.FullName)/Release/*" runtime -Force
          Copy-Item "$($distribution.FullName)/Resources/*" runtime -Recurse -Force
          Copy-Item ui/* runtime/ui/ -Recurse -Force
          Copy-Item vpn runtime/ -Recurse -Force
          ./scripts/prepare-vpn-components.ps1 -Destination "$env:GITHUB_WORKSPACE/runtime/vpn/native-host"
          python -m pip install --disable-pip-version-check websocket-client pillow
      - name: Check internal controls
        shell: pwsh
        run: python scripts/test-cef-next-ui.py "$env:GITHUB_WORKSPACE/runtime/Soulu.exe" artifacts/next-ui
      - name: Check Reader Mode and styled font listbox
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/test-cef-site-reader.py "$env:GITHUB_WORKSPACE/runtime/Soulu.exe"
      - name: Check settings theme and toolbar state
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:SOULU_UI_TEST_PORT='9223'
          $env:SOULU_REGRESSION_SKIP_FIRST_RUN='1'
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'soulu-ui-theme'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
          $app=Start-Process "$env:GITHUB_WORKSPACE/runtime/Soulu.exe" -PassThru
          $env:SOULU_TEST_PROCESS_ID=[string]$app.Id
          try {
            python scripts/test-cef-ui.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force }
      - name: Check real YouTube integration
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python scripts/test-cef-video-translation.py "$env:GITHUB_WORKSPACE/runtime/Soulu.exe" artifacts/video
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soulu-ui-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
