name: Build and publish Soul 0.12.0 Preview
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/build-soul12.yml']
permissions:
  contents: write
  actions: write
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cancel superseded Preview 12 checks
        shell: pwsh
        run: |
          $runs = gh run list --workflow build-soul12.yml --branch gecko-preview --limit 30 --json databaseId,status | ConvertFrom-Json
          foreach ($old in $runs) { if ([long]$old.databaseId -lt [long]$env:GITHUB_RUN_ID -and $old.status -in @('in_progress','queued')) { gh run cancel $old.databaseId } }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Restore exact verified Preview 8 payload and apply targeted changes
        id: assemble
        shell: pwsh
        run: |
          $run = gh run view 41834119852 --json conclusion,headSha | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.headSha -ne 'a94114bd475eadeed99703faec0c4c4df3214ec3') { throw 'Preview 8 provenance mismatch' }
          gh run download 41834119852 -n gecko8-verified-build-inputs -D gecko-out
          if ($LASTEXITCODE) { throw 'Verified Preview 8 download failed' }
          python gecko/prepare-preview12.py
          if ($LASTEXITCODE) { throw 'Soul 0.12.0 Preview overlay failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Soul.exe .
          if ($LASTEXITCODE) { throw 'Launcher compilation failed' }
          Pop-Location
          python gecko/brand-engine.py
          if ($LASTEXITCODE) { throw 'Engine branding failed' }
          python -m pip install marionette_driver pillow psutil websocket-client
      - name: Verify requested welcome, extensions and restart scenarios
        run: python gecko/tests/preview12.py gecko-out/engine/SoulEngine.exe soul12-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soul12-browser-evidence
          path: soul12-checks/
      - name: Build Soul 0.12.0 Preview installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soul-0.12.0-Preview-Setup-win64.exe
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ((Get-Item Soul-0.12.0-Preview-Setup-win64.exe).VersionInfo.ProductVersion -ne '0.12.0.0') { throw 'Installer version mismatch' }
      - name: Verify clean installation, first launch, upgrade and removal
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python gecko/tests/installer12.py Soul-0.12.0-Preview-Setup-win64.exe soul12-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soul12-evidence
          path: soul12-checks/
      - uses: actions/upload-artifact@v4
        with:
          name: soul12-verified-installer
          path: |
            Soul-0.12.0-Preview-Setup-win64.exe
            Soul-0.12.0-Preview-Setup-win64.exe.build.json
      - name: Publish tested Soul 0.12.0 Preview installer
        shell: pwsh
        run: |
          python -c "import json,pathlib; paths=['preview12.json','installer12.json']; assert all(json.loads((pathlib.Path('soul12-checks')/p).read_text())['passed'] for p in paths)"
          if ($LASTEXITCODE) { throw 'Acceptance reports not green' }
          (Get-FileHash Soul-0.12.0-Preview-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soul-0.12.0-Preview-Setup-win64.exe' | Set-Content SHA256SUMS.txt
          $branchHead = gh api repos/sanderstripa/soulu/git/ref/heads/gecko-preview --jq '.object.sha'
          if ($branchHead.Trim() -ne $env:GITHUB_SHA) { throw 'A newer source revision superseded this build' }
          gh release create soul-preview-12 Soul-0.12.0-Preview-Setup-win64.exe Soul-0.12.0-Preview-Setup-win64.exe.build.json SHA256SUMS.txt soul12-checks/preview12.json soul12-checks/installer12.json --target $env:GITHUB_SHA --title 'Soul 0.12.0 Preview' --notes-file gecko/docs/PREVIEW12-RESULTS.md
          if ($LASTEXITCODE) { throw 'Release publication failed' }

# Normalize the Mozilla optimized archive before early chrome styling.

# Reconstruct the optimized central directory without altering file offsets.

# Exercise the renamed application entry point and repair ownership marker.

# Verify live weather and absence of new Firefox registrations.

# Run direct-engine tests with the same application.ini as Soul.exe.

# Keep XRE application directory at engine/browser for the external app manifest.

# Capture actual visible startup frames for review.

# XRE ini parser requires exact Name=Value without padded key names.

# Use Soul labels in the packaged settings and update controls.

# Avoid re-triggering the add-on document observer with an unchanged title.

# Close the reopened browser through the actual Windows close button path.

# Keep last-window shutdown in a module that survives the closing window global.
