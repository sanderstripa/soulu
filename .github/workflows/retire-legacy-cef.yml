name: Retire legacy CEF build objects
on:
  push:
    branches: [cef-retirement-disabled]
    paths: [".github/workflows/retire-legacy-cef.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  retire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove withdrawn release, legacy caches, artifacts and rerunnable builds
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const cutoff = new Date('2026-09-30T13:20:01Z');
            const summary = [];
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {owner, repo, per_page: 100});
            const legacy = workflows.find(w => w.path === '.github/workflows/build-installer-from-artifact.yml');
            if (legacy) {
              await github.rest.actions.disableWorkflow({owner, repo, workflow_id: legacy.id});
              summary.push('Disabled legacy artifact release workflow ' + legacy.id);
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag: 'preview-26'})).data;
            } catch (error) { if (error.status !== 404) throw error; }
            if (release) {
              if (release.id !== 399966749 || release.immutable) throw new Error('Preview 26 object changed; refusing unverified deletion');
              await github.rest.repos.deleteRelease({owner, repo, release_id: release.id});
              summary.push('Deleted withdrawn Preview 26 release ' + release.id);
            }
            let tag;
            try {
              tag = (await github.rest.git.getRef({owner, repo, ref: 'tags/preview-26'})).data;
            } catch (error) { if (error.status !== 404) throw error; }
            if (tag) {
              if (tag.object.sha !== '01a7a3f660d6e6bfbaafd9aac1d1051b8d7beaf7') throw new Error('Preview 26 tag target changed');
              await github.rest.git.deleteRef({owner, repo, ref: 'tags/preview-26'});
              summary.push('Deleted preview-26 tag');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, per_page: 100});
            for (const run of runs) {
              if (!['.github/workflows/build-cef.yml', '.github/workflows/build-installer-from-artifact.yml'].includes(run.path) ||
                  new Date(run.created_at) > cutoff || run.head_sha === context.sha) continue;
              if (run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                summary.push('Cancelled legacy run ' + run.id);
                // Fail closed until cancellation finishes; retry this cleanup if needed.
                throw new Error('Legacy run cancellation pending: ' + run.id);
              }
              await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
              summary.push('Deleted legacy run and its artifacts ' + run.id);
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {owner, repo, per_page: 100});
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('Sona-Preview-') && new Date(artifact.created_at) <= cutoff) {
                await github.rest.actions.deleteArtifact({owner, repo, artifact_id: artifact.id});
                summary.push('Deleted legacy artifact ' + artifact.id);
              }
            }
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {owner, repo, per_page: 100});
            for (const cache of caches) {
              if (cache.key.startsWith('sona-cef-')) {
                await github.rest.actions.deleteActionsCacheById({owner, repo, cache_id: cache.id});
                summary.push('Deleted CEF cache ' + cache.id + ' (' + cache.key + ')');
              }
            }
            core.info(summary.join('\n'));
            await core.summary.addHeading('Legacy CEF cleanup').addList(summary).write();
