name: Soulu Gecko Preview 3
on:
  push:
    branches: [gecko-preview]
    paths: ['gecko/**', '.github/workflows/build-gecko3.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: soulu-gecko-preview3
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: 1
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Assemble pinned Gecko and Soulu Preview 3
        run: python gecko/build.py --platform win64 --output gecko-out
      - name: Reuse byte-identical VPN and blocker binaries from Preview 2
        shell: pwsh
        run: |
          gh release download gecko-preview-2 -p Soulu-Gecko-Preview-2-win64.zip -p SHA256SUMS.txt -D previous
          $expected = ((Get-Content previous/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash previous/Soulu-Gecko-Preview-2-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Previous release checksum mismatch' }
          Expand-Archive previous/Soulu-Gecko-Preview-2-win64.zip previous/expanded
          Copy-Item previous/expanded/runtime/soulu/vpn gecko-out/runtime/soulu/vpn -Recurse
          Copy-Item previous/expanded/runtime/soulu/adblock gecko-out/runtime/soulu/adblock -Recurse
      - name: Embed the CEF icon into the portable EXE
        shell: pwsh
        run: |
          Push-Location gecko/launcher
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico ../../ui/soulu-app-icon.ico -o rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Icon resource compilation failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o '../../gecko-out/Soulu Gecko Preview 3.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          Pop-Location
      - name: Verify only the requested Preview 3 changes on Windows
        shell: pwsh
        run: |
          python -m pip install marionette_driver pillow
          python gecko/tests/preview3.py gecko-out/runtime/firefox.exe gecko3-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Preview 3 checks failed' }
          Copy-Item gecko3-acceptance/preview3.json gecko-out/preview3.json
      - name: Package the verified candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force gecko-out/visual-evidence | Out-Null
          Copy-Item gecko3-acceptance/*preview3.png gecko-out/visual-evidence/
          Compress-Archive -Path gecko-out/* -DestinationPath Soulu-Gecko-Preview-3-win64.zip -CompressionLevel Optimal
          (Get-FileHash Soulu-Gecko-Preview-3-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-Gecko-Preview-3-win64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko3-acceptance
          path: gecko3-acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: Soulu-Gecko-Preview-3-win64
          path: |
            Soulu-Gecko-Preview-3-win64.zip
            SHA256SUMS.txt
