name: Build and publish Soulu Gecko Preview 11
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/build-gecko11.yml']
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Restore exact verified Preview 8 payload and apply targeted changes
        id: assemble
        shell: pwsh
        run: |
          $run = gh run view 41834119852 --json conclusion,headSha | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.headSha -ne 'a94114bd475eadeed99703faec0c4c4df3214ec3') { throw 'Preview 8 provenance mismatch' }
          gh run download 41834119852 -n gecko8-verified-build-inputs -D gecko-out
          if ($LASTEXITCODE) { throw 'Verified Preview 8 download failed' }
          python gecko/prepare-preview11.py
          if ($LASTEXITCODE) { throw 'Preview 11 overlay failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Soulu.exe .
          if ($LASTEXITCODE) { throw 'Launcher compilation failed' }
          Pop-Location
          python -m pip install marionette_driver pillow psutil websocket-client
      - name: Verify weather and Mozilla folder deletion in the real browser
        run: python gecko/tests/preview11.py gecko-out/runtime/firefox.exe gecko11-checks
      - name: Build Preview 11 installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soulu-Gecko-Preview-11-Setup-win64.exe
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ((Get-Item Soulu-Gecko-Preview-11-Setup-win64.exe).VersionInfo.ProductVersion -ne '0.11.0.0') { throw 'Installer version mismatch' }
      - name: Verify clean installation, first launch, upgrade and removal
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python gecko/tests/installer11.py Soulu-Gecko-Preview-11-Setup-win64.exe gecko11-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko11-evidence
          path: gecko11-checks/
      - uses: actions/upload-artifact@v4
        with:
          name: gecko11-verified-installer
          path: |
            Soulu-Gecko-Preview-11-Setup-win64.exe
            Soulu-Gecko-Preview-11-Setup-win64.exe.build.json
      - name: Publish tested Preview 11 installer
        shell: pwsh
        run: |
          python -c "import json,pathlib; paths=['preview11.json','installer11.json']; assert all(json.loads((pathlib.Path('gecko11-checks')/p).read_text())['passed'] for p in paths)"
          if ($LASTEXITCODE) { throw 'Acceptance reports not green' }
          (Get-FileHash Soulu-Gecko-Preview-11-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-Gecko-Preview-11-Setup-win64.exe' | Set-Content SHA256SUMS.txt
          gh release create gecko-preview-10 Soulu-Gecko-Preview-11-Setup-win64.exe Soulu-Gecko-Preview-11-Setup-win64.exe.build.json SHA256SUMS.txt gecko11-checks/preview11.json gecko11-checks/installer11.json --target $env:GITHUB_SHA --title 'Soulu Gecko Preview 11' --notes-file gecko/docs/PREVIEW10-RESULTS.md
          if ($LASTEXITCODE) { throw 'Release publication failed' }
