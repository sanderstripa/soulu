name: Finalize and publish Sona Gecko Preview 4
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/finalize-gecko4.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: sona-gecko-final4
  cancel-in-progress: false
jobs:
  windows-final:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: 1
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful full Windows candidate and download exact bytes
        shell: pwsh
        run: |
          if ((gh api repos/sanderstripa/soulu/actions/runs/41653080983 --jq .conclusion) -ne 'success') { throw 'Full Windows acceptance is not successful' }
          if ((gh api repos/sanderstripa/soulu/actions/runs/41653080983 --jq .head_sha) -ne 'c09a46573870d3eea0adf15015b1d15e6dc9abe2') { throw 'Wrong base source' }
          gh run download 41653080983 -n Sona-Gecko-Preview-4-win64 -D candidate
          gh run download 41653080983 -n gecko4-acceptance -D gecko4-baseline
          python gecko/tests/prepare-final4.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate verification/overlay failed' }
      - name: Check only final changes and retained translator/weather on Windows
        shell: pwsh
        run: |
          python -m pip install marionette_driver pillow psutil websocket-client
          python gecko/tests/final4.py gecko-out/runtime/firefox.exe gecko4-final
          if ($LASTEXITCODE -ne 0) { throw 'Final targeted checks failed' }
          Copy-Item gecko4-final/final4.json gecko-out/
      - name: Compare final UI against CEF after the navigation-control fix
        shell: pwsh
        run: |
          python gecko/tests/visual-cef.py gecko-out/runtime/firefox.exe gecko4-final
          if ($LASTEXITCODE -ne 0) { throw 'Final CEF comparison failed' }
          Copy-Item gecko4-final/visual-comparison.json gecko-out/
          Remove-Item gecko-out/visual-evidence -Recurse -Force
          New-Item -ItemType Directory gecko-out/visual-evidence | Out-Null
          Copy-Item gecko4-final/*comparison.png gecko-out/visual-evidence/
      - name: Package final ZIP and launch its extracted portable EXE
        shell: pwsh
        run: |
          Compress-Archive -Path gecko-out/* -DestinationPath Sona-Gecko-Preview-4-win64.zip -CompressionLevel Optimal
          python gecko/tests/zip_smoke.py Sona-Gecko-Preview-4-win64.zip gecko4-final
          if ($LASTEXITCODE -ne 0) { throw 'Final extracted ZIP failed to launch' }
          (Get-FileHash Sona-Gecko-Preview-4-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  Sona-Gecko-Preview-4-win64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko4-final-evidence
          path: gecko4-final/
      - uses: actions/upload-artifact@v4
        with:
          name: Sona-Gecko-Preview-4-final
          path: |
            Sona-Gecko-Preview-4-win64.zip
            SHA256SUMS.txt
      - name: Publish only after archive launch and every required gate
        shell: pwsh
        run: |
          python -c "import json,pathlib; p=pathlib.Path('gecko4-final'); assert json.loads((p/'final4.json').read_text(encoding='utf-8'))['passed']; assert json.loads((p/'visual-comparison.json').read_text(encoding='utf-8'))['passed']; assert json.loads((p/'zip-smoke.json').read_text(encoding='utf-8'))['passed']"
          if ($LASTEXITCODE -ne 0) { throw 'Final publication gate failed' }
          gh release view gecko-preview-4 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing overwrite' }
          gh release create gecko-preview-4 Sona-Gecko-Preview-4-win64.zip SHA256SUMS.txt gecko-out/BUILD.json gecko-out/preview4.json gecko-out/adblock-update.json gecko4-final/final4.json gecko4-final/visual-comparison.json gecko4-final/zip-smoke.json gecko/docs/PREVIEW4-RESULTS.md --target "$env:GITHUB_SHA" --title 'Sona Gecko Preview 4' --prerelease --notes-file gecko/docs/PREVIEW4-RESULTS.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
