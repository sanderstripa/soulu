      - name: Verify release acceptance scope and public-site evidence
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.67')) && (success() && (github.ref == 'refs/tags/beta-1.0.67' || (github.ref == 'refs/heads/main' && (inputs.publish || env.AUTOMATED_RELEASE == 'true')))) }}
        shell: pwsh
        env:
