      - name: Smoke-test visible installer controls with mouse on Windows
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && (!cancelled() && steps.verified.outputs.passed == 'true') }}
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MouseTest {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left, Top, Right, Bottom; }
            public delegate bool EnumProc(IntPtr hwnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X, Y; }
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT point);
            public static string Describe(IntPtr hwnd) {
              var cls = new System.Text.StringBuilder(128);
              var txt = new System.Text.StringBuilder(256);
              GetClassName(hwnd, cls, cls.Capacity);
              GetWindowText(hwnd, txt, txt.Capacity);
              return $"{cls}: {txt} hwnd={hwnd}";
            }
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll", EntryPoint="GetClassLongPtrW")] public static extern IntPtr GetClassLongPtr(IntPtr hWnd, int index);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, EnumProc callback, IntPtr data);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr hwnd, System.Text.StringBuilder text, int max);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr hwnd, System.Text.StringBuilder text, int max);
            public static IntPtr FindButton(IntPtr parent, string prefix) {
              IntPtr found = IntPtr.Zero;
              EnumChildWindows(parent, delegate(IntPtr hwnd, IntPtr data) {
                var cls = new System.Text.StringBuilder(128);
                var txt = new System.Text.StringBuilder(256);
                GetClassName(hwnd, cls, cls.Capacity);
                GetWindowText(hwnd, txt, txt.Capacity);
                if (cls.ToString().Equals("Button", StringComparison.OrdinalIgnoreCase) &&
                    txt.ToString().StartsWith(prefix, StringComparison.OrdinalIgnoreCase)) {
                  found = hwnd; return false;
                }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          '@

          Add-Type -AssemblyName System.Drawing
          function Save-Window($handle, [string]$name) {
            $bounds=New-Object MouseTest+RECT
            [MouseTest]::GetWindowRect($handle,[ref]$bounds) | Out-Null
            $bmp=New-Object System.Drawing.Bitmap ($bounds.Right-$bounds.Left),($bounds.Bottom-$bounds.Top)
            $graphics=[System.Drawing.Graphics]::FromImage($bmp)
            $graphics.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bmp.Size)
            $bmp.Save((Join-Path $PWD "browser/artifacts/$name.png"))
            $graphics.Dispose();$bmp.Dispose()
            "SOULU_SCREENSHOT:$name="+[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD "browser/artifacts/$name.png")))
          }
          function Click-At([int]$x, [int]$y) {
            [MouseTest]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 150
            [MouseTest]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Milliseconds 100
            [MouseTest]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          }

          $installer = Join-Path $PWD "browser/artifacts/Soulu-Beta-1.0.$env:BETA_NUMBER-x64.exe"
          # Keep the installed-browser check independent of the diagnostic UI
          # probe's settings and force-closed profile.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-installer-smoke'
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/Soulu/Soulu.exe"
          $installedDirectory = [IO.Path]::GetFullPath((Split-Path $installedExe))
          $smokeRoot = [IO.Path]::GetFullPath($env:LOCALAPPDATA) + [IO.Path]::DirectorySeparatorChar
          if (!$installedDirectory.StartsWith($smokeRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe installer test directory' }
          if (Test-Path -LiteralPath $installedDirectory) { Remove-Item -LiteralPath $installedDirectory -Recurse -Force }
          # Simulate stale icon files from an existing installation. Existing
          # pinned v24 icon paths must still resolve, but contain the new mark.
          $legacyUi = Join-Path (Split-Path $installedExe) 'ui'
          New-Item -ItemType Directory -Force $legacyUi | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $legacyUi 'soulu-icon-v24.ico'),[byte[]](1,2,3))
          [IO.File]::WriteAllBytes((Join-Path $legacyUi 'soulu-icon.jpg'),[byte[]](1,2,3))

          $process = Start-Process $installer -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and $process.MainWindowHandle -eq 0) {
            Start-Sleep -Milliseconds 250
            $process.Refresh()
          }
          if ($process.MainWindowHandle -eq 0) { throw "Installer window did not open" }

          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          $beforeDrag = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle, [ref]$beforeDrag) | Out-Null
          [MouseTest]::SetCursorPos(($beforeDrag.Left + 130), ($beforeDrag.Top + 25)) | Out-Null
          Start-Sleep -Milliseconds 200
          [MouseTest]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          [MouseTest]::SetCursorPos(($beforeDrag.Left + 220), ($beforeDrag.Top + 80)) | Out-Null
          Start-Sleep -Milliseconds 350
          [MouseTest]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          $afterDrag = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle, [ref]$afterDrag) | Out-Null
          "Drag check: before=$($beforeDrag.Left),$($beforeDrag.Top) after=$($afterDrag.Left),$($afterDrag.Top)"
          if (($afterDrag.Left - $beforeDrag.Left) -lt 40) { throw "Installer window did not move by mouse drag" }
          Save-Window $process.MainWindowHandle "installer-welcome"
          $deadline = (Get-Date).AddSeconds(30)
          $installHwnd = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline -and $installHwnd -eq [IntPtr]::Zero) {
            Start-Sleep -Milliseconds 250
            $installHwnd = [MouseTest]::FindButton($process.MainWindowHandle, "Установить")
          }
          if ($installHwnd -eq [IntPtr]::Zero) { throw "Native Install button handle was not found" }
          $rect = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($installHwnd, [ref]$rect) | Out-Null
          $x = [int](($rect.Left + $rect.Right) / 2)
          $y = [int](($rect.Top + $rect.Bottom) / 2)
          $hit = [MouseTest]::WindowFromPoint([MouseTest+POINT]@{ X=$x; Y=$y })
          "Install control: $([MouseTest]::Describe($installHwnd)); mouse hit: $([MouseTest]::Describe($hit)) at $x,$y"
          if ($hit -ne $installHwnd) { throw "Visible Install button is occluded by another control" }
          Click-At $x $y
          Start-Sleep -Milliseconds 300
          Save-Window $process.MainWindowHandle "installer-installing"
          $during=New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle,[ref]$during) | Out-Null
          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          [MouseTest]::SetCursorPos(($during.Left+120),($during.Top+25)) | Out-Null
          Start-Sleep -Milliseconds 200
          [MouseTest]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
          Start-Sleep -Milliseconds 150
          [MouseTest]::SetCursorPos(($during.Left+170),($during.Top+50)) | Out-Null
          Start-Sleep -Milliseconds 250
          [MouseTest]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
          $moved=New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle,[ref]$moved) | Out-Null
          if(($moved.Left-$during.Left) -lt 30){throw 'Installer did not move during extraction'}

          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $installedExe)) {
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $installedExe)) { throw "Mouse click on Install did not start installation" }

          $process.Refresh()
          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          # File creation happens before the full 387 MB payload has finished
          # extracting. Wait for the actual finish-page control, not a timer.
          $deadline = (Get-Date).AddMinutes(5)
          $openHwnd = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline -and $openHwnd -eq [IntPtr]::Zero) {
            Start-Sleep -Milliseconds 250
            $openHwnd = [MouseTest]::FindButton($process.MainWindowHandle, "Готово")
          }
          if ($openHwnd -eq [IntPtr]::Zero) { throw "Native Open button handle was not found" }
          $canonicalHash=(Get-FileHash 'browser/ui/soulu-icon.ico').Hash
          foreach($name in @('soulu-icon-v24.ico','soulu-icon-v44.ico','soulu-icon.ico','soulu-app-icon.ico','soulu-shortcut-icon.ico','soulu-installer-icon.ico','browser-icon.ico','browser-app-icon.ico')){
            if((Get-FileHash (Join-Path $legacyUi $name)).Hash -ne $canonicalHash){throw "Stale installed icon: $name"}
          }
          if(Test-Path (Join-Path $legacyUi 'soulu-icon.jpg')){throw 'Legacy opaque logo was not removed'}
          $desktopLink=Join-Path ([Environment]::GetFolderPath('Desktop')) 'Soulu.lnk'
          $startLink=Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Soulu/Soulu.lnk'
          $shortcutShell=New-Object -ComObject WScript.Shell
          foreach($link in @($desktopLink,$startLink)){
            if(-not (Test-Path $link)){throw "Soulu shortcut missing: $link"}
            $iconLocation=$shortcutShell.CreateShortcut($link).IconLocation
            "Shortcut icon: $link -> $iconLocation"
            if($iconLocation -notmatch 'soulu-icon-v44\.ico,0$'){throw "Shortcut still references stale icon: $iconLocation"}
          }
          $uninstaller=Join-Path (Split-Path $installedExe) 'Uninstall Soulu.exe'
          if(-not (Test-Path $uninstaller)){throw 'Uninstall Soulu.exe is missing'}
          python browser/scripts/verify-branding.py --binary $installedExe --binary $uninstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstallIcon=[System.Drawing.Icon]::ExtractAssociatedIcon($uninstaller)
          if(-not $uninstallIcon){throw 'Uninstall Soulu.exe has no associated icon'}
          $uninstallIcon.ToBitmap().Save((Join-Path $PWD 'browser/artifacts/uninstaller-exe-icon.png'))
          $appEntry=Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Soulu'
          if($appEntry.DisplayIcon -ne $installedExe){throw "Installed Apps icon target is wrong: $($appEntry.DisplayIcon)"}
          Start-Sleep -Seconds 4
          $process.Refresh()
          if ($process.HasExited) { throw "Installer closed without clicking Open" }
          Save-Window $process.MainWindowHandle "installer-finished"
          $stillOpen = [MouseTest]::FindButton($process.MainWindowHandle, "Готово")
          if ($stillOpen -eq [IntPtr]::Zero) { throw "Finish screen disappeared without user input" }
          [MouseTest]::GetWindowRect($openHwnd, [ref]$rect) | Out-Null
          $openX = [int](($rect.Left + $rect.Right) / 2)
          $openY = [int](($rect.Top + $rect.Bottom) / 2)
          $openHit = [MouseTest]::WindowFromPoint([MouseTest+POINT]@{ X=$openX; Y=$openY })
          "Open control: $([MouseTest]::Describe($openHwnd)); mouse hit: $([MouseTest]::Describe($openHit))"
          if ($openHit -ne $openHwnd) { throw "Visible Open button is occluded by another control" }
          Click-At $openX $openY

          $deadline = (Get-Date).AddSeconds(45)
          $soulu = $null
          while ((Get-Date) -lt $deadline -and -not $soulu) {
            Start-Sleep -Milliseconds 500
            # CEF also starts Soulu processes with no top-level window. Wait
            # for the browser host, rather than inspect the whole process array.
            $soulu = Get-Process Soulu -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | Select-Object -First 1
          }
          if (-not $soulu) { throw "Mouse click on Open did not create a Soulu taskbar window" }
          $taskbarIcon=[MouseTest]::SendMessage($soulu.MainWindowHandle,0x007F,[IntPtr]2,[IntPtr]::Zero)
          if($taskbarIcon -eq [IntPtr]::Zero){$taskbarIcon=[MouseTest]::GetClassLongPtr($soulu.MainWindowHandle,-34)}
          if($taskbarIcon -eq [IntPtr]::Zero){$taskbarIcon=[MouseTest]::GetClassLongPtr($soulu.MainWindowHandle,-14)}
          if($taskbarIcon -eq [IntPtr]::Zero){throw 'Soulu taskbar window has no small icon'}
          [System.Drawing.Icon]::FromHandle($taskbarIcon).ToBitmap().Save((Join-Path $PWD 'browser/artifacts/taskbar-window-icon.png'))
          python browser/scripts/verify-branding.py --shortcut $desktopLink --shortcut $startLink --window ($soulu.MainWindowHandle.ToInt64())
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.Windows.Forms
          $desktopBounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shellBitmap=[System.Drawing.Bitmap]::new($desktopBounds.Width,$desktopBounds.Height)
          $shellGraphics=[System.Drawing.Graphics]::FromImage($shellBitmap)
          $shellGraphics.CopyFromScreen($desktopBounds.Left,$desktopBounds.Top,0,0,$shellBitmap.Size)
          $shellBitmap.Save((Join-Path $PWD 'browser/artifacts/taskbar-desktop-shell.png'))
          $shellGraphics.Dispose();$shellBitmap.Dispose()
          Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
          "Physical mouse-click, extraction drag and persistent finish checks passed."
          # Replace the test installation with the actual published Beta 1.0.57
          # runtime, then upgrade it with this final-main installer.
          $previousZip = Join-Path $env:RUNNER_TEMP 'soulu-beta-1.0.57.zip'
          Invoke-WebRequest 'https://github.com/sanderstripa/soulu/releases/download/beta-1.0.57/Soulu-Beta-1.0.57-x64.zip' -OutFile $previousZip
          if ((Get-FileHash -LiteralPath $previousZip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '071f0706362f2e5601b84e596655a12d492ca99ec7e957f0cbc5ce8c67625704') { throw 'Previous Beta archive checksum mismatch' }
          Expand-Archive -LiteralPath $previousZip -DestinationPath $installedDirectory -Force
          $previousReport = Join-Path $env:RUNNER_TEMP 'soulu-previous-engine.json'
          $previousProbe = Start-Process $installedExe -ArgumentList @("--engine-version-file=`"$previousReport`"") -WorkingDirectory $installedDirectory -WindowStyle Hidden -PassThru -Wait
          if ($previousProbe.ExitCode -ne 0) { throw 'Previous Beta engine probe failed' }
          $previousEngine = Get-Content -LiteralPath $previousReport -Raw | ConvertFrom-Json
          if ($previousEngine.cef -cne '154.0.33' -or $previousEngine.chromium -cne '154.0.8037.94') { throw 'Upgrade baseline is not the published Beta 1.0.57 runtime' }
          # Repeat with launch unchecked: Done must close without starting Soulu.
          $noLaunch = Start-Process $installer -PassThru
          Start-Sleep -Seconds 2
          $noLaunch.Refresh()
          $button=[MouseTest]::FindButton($noLaunch.MainWindowHandle,"Установить")
          [MouseTest]::GetWindowRect($button,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          $deadline=(Get-Date).AddMinutes(5)
          $done=[IntPtr]::Zero
          while((Get-Date) -lt $deadline -and $done -eq [IntPtr]::Zero){
            Start-Sleep -Milliseconds 300
            $done=[MouseTest]::FindButton($noLaunch.MainWindowHandle,"Готово")
          }
          if($done -eq [IntPtr]::Zero){throw 'Second install did not finish'}
          $toggle=[MouseTest]::FindButton($noLaunch.MainWindowHandle,"Запустить Soulu")
          if($toggle -eq [IntPtr]::Zero){throw 'Launch checkbox missing'}
          [MouseTest]::GetWindowRect($toggle,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          [MouseTest]::GetWindowRect($done,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          if(-not $noLaunch.WaitForExit(5000)){throw 'Done did not close installer'}
          Start-Sleep -Seconds 2
          if(Get-Process Soulu -ErrorAction SilentlyContinue){throw 'Soulu started with launch unchecked'}
          foreach ($artifact in @('shared.lib', 'shared.pdb', 'soulu.pdb')) {
            if (Test-Path -LiteralPath (Join-Path $installedDirectory $artifact)) { throw "Upgrade retained a build artifact: $artifact" }
          }
          "Unchecked-launch scenario passed."
          # A close click must exit directly, without a confirmation window.
          $again = Start-Process $installer -PassThru
          Start-Sleep -Seconds 2
          $again.Refresh()
          $closeHwnd=[MouseTest]::FindButton($again.MainWindowHandle,"Закрыть")
          if($closeHwnd -eq [IntPtr]::Zero){throw 'Close control missing'}
          [MouseTest]::GetWindowRect($closeHwnd,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          if(-not $again.WaitForExit(5000)){throw 'Close click did not close installer directly'}

          # Exercise the real uninstall path after both launch scenarios.
          & ./browser/scripts/verify-cef-engine.ps1 -BuildDir (Split-Path $installedExe) -ReportPath browser/artifacts/installed-engine-version.json
          $installedTestLocal = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-installed-storage-profile'
            python browser/scripts/test-cef-storage.py $installedExe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:LOCALAPPDATA = $installedTestLocal
          }
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and (Get-Process Soulu -ErrorAction SilentlyContinue | Where-Object Path -eq $installedExe)) {
            Start-Sleep -Milliseconds 250
          }
          if (Get-Process Soulu -ErrorAction SilentlyContinue | Where-Object Path -eq $installedExe) {
            throw 'Installed Soulu left child processes after normal shutdown'
          }
          $uninstall = Start-Process $uninstaller -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
          if($uninstall.ExitCode -ne 0){throw 'Uninstaller failed'}
          $deadline=(Get-Date).AddSeconds(30)
          while((Get-Date) -lt $deadline -and (Test-Path $installedExe)){Start-Sleep -Milliseconds 250}
          if(Test-Path $installedExe){throw 'Uninstaller left Soulu.exe behind'}
          if((Test-Path $desktopLink) -or (Test-Path $startLink)){throw 'Uninstaller left shortcuts behind'}
          if(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Soulu'){throw 'Uninstaller left Installed Apps registration behind'}


      - name: Upload visual checks
        continue-on-error: true
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-visual-checks
          path: browser/artifacts/*.png
          if-no-files-found: ignore

      - name: Upload preview artifacts
        # Preserve the verified binary for diagnosing failed runtime tests.
        # Release publication below still requires every mandatory check.
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && (always() && steps.verified.outputs.passed == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-Beta-1.0.${{ env.BETA_NUMBER }}-x64
          path: |
            browser/artifacts/Soulu-Beta-1.0.${{ env.BETA_NUMBER }}-x64.zip
            browser/artifacts/Soulu-Beta-1.0.${{ env.BETA_NUMBER }}-x64.exe
            browser/artifacts/engine-version.json
          if-no-files-found: error

      - name: Upload native data-security evidence
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-data-security-${{ github.run_id }}
          path: browser/artifacts/data-security.json
          if-no-files-found: ignore

      - name: Upload installer typography diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-installer-typography-${{ github.sha }}
          path: browser/artifacts/installer-typography/
          if-no-files-found: ignore

      - name: Upload native menu typography visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-native-menu-typography-${{ github.sha }}
          path: browser/artifacts/native-menu-visuals/
          if-no-files-found: ignore

      - name: Compare real public websites with AdBlock OFF and ON
        shell: pwsh
        run: |
          python browser/scripts/test-cef-adblock-public.py "$env:build_dir/Soulu.exe" browser/artifacts/adblock-public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload AdBlock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-adblock-${{ github.sha }}
          path: |
            browser/artifacts/adblock*.json
            browser/artifacts/adblock-public/
          if-no-files-found: ignore

      - name: Verify release source is the current main commit
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && (success() && (github.ref == 'refs/tags/beta-1.0.59' || (github.ref == 'refs/heads/main' && inputs.publish))) }}
        shell: pwsh
        working-directory: browser
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $headSha = git rev-parse HEAD
          $mainSha = git rev-parse origin/main
          if ($headSha -ne $env:GITHUB_SHA -or $mainSha -ne $env:GITHUB_SHA) {
            throw "Release source must equal current origin/main: HEAD=$headSha main=$mainSha build=$env:GITHUB_SHA"
          }
          Write-Host "Release source verified: HEAD == origin/main == $headSha"

      - name: Verify mandatory manual regression evidence belongs to this SHA
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && (success() && (github.ref == 'refs/tags/beta-1.0.59' || (github.ref == 'refs/heads/main' && inputs.publish))) }}
        shell: pwsh
        env:
          MANUAL_CHECKS_SHA: ${{ inputs.manual_checks_sha }}
          DEFER_AUTH_CHECKS: ${{ inputs.defer_auth_checks }}
          DEFER_DESKTOP_CHECKS: ${{ inputs.defer_desktop_checks }}
        run: |
          if ($env:MANUAL_CHECKS_SHA -cne $env:GITHUB_SHA) {
            throw 'Publication blocked: manual acceptance or explicit owner deferrals must cover this exact SHA'
          }
          if ($env:DEFER_AUTH_CHECKS -eq 'true') {
            'Google/Ozon authenticated-session restart checks were explicitly deferred to the owner; they were not performed for this release.' | Add-Content browser/artifacts/release-notes.md -Encoding utf8
          }
          if ($env:DEFER_DESKTOP_CHECKS -eq 'true') {
            'The owner will complete the remaining physical desktop acceptance checks. Automated Windows/CEF checks remain required; unfinished manual checks are not claimed as passed.' | Add-Content browser/artifacts/release-notes.md -Encoding utf8
          }
          $sites = Get-Content browser/artifacts/sites-evidence.json -Raw | ConvertFrom-Json
          $unopened = @($sites | Where-Object { !$_.opened })
          # The existing native diagnostic separates Ozon's hosted-runner
          # HTTP rejection from browser/network failure. The owner explicitly
          # chose to check Ozon personally and permits this release without it.
          $deferredOzon = $env:DEFER_AUTH_CHECKS -eq 'true' -and $unopened.Count -eq 1 -and
            $unopened[0].host -eq 'ozon.ru' -and $unopened[0].externalServiceRejection -and
            @($unopened[0].events | Where-Object {
              $_.event -eq 'Network.responseReceived' -and $_.response.status -in @(403,429) -and
              $_.response.url -match '^https://(?:www\.)?ozon\.ru/' -and $_.response.securityState -eq 'secure'
            }).Count -gt 0 -and
            @($unopened[0].events | Where-Object { $_.event -eq 'Network.loadingFailed' -and !$_.canceled }).Count -eq 0
          if (@($sites).Count -ne 7 -or ($unopened.Count -gt 0 -and !$deferredOzon)) {
            throw 'Publication blocked: one or more required sites did not serve usable content'
          }
          if ($deferredOzon) {
            'Anonymous Ozon access from the GitHub Windows runner returned a secure HTTP 403/429 server rejection. Usable Ozon content is not claimed as verified; the owner will check Ozon personally. The other six required sites opened successfully.' | Add-Content browser/artifacts/release-notes.md -Encoding utf8
          }

      - name: Publish Soulu release
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && (success() && (github.ref == 'refs/tags/beta-1.0.59' || (github.ref == 'refs/heads/main' && inputs.publish)) && steps.verified.outputs.passed == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-1.0.${{ env.BETA_NUMBER }}
          name: Soulu Beta 1.0.${{ env.BETA_NUMBER }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: browser/artifacts/release-notes.md
          files: |
            browser/artifacts/Soulu-Beta-1.0.${{ env.BETA_NUMBER }}-x64.exe
            browser/artifacts/Soulu-Beta-1.0.${{ env.BETA_NUMBER }}-x64.zip
            browser/artifacts/engine-version.json
            browser/artifacts/data-security.json
            browser/artifacts/browser-import-native.json
            browser/artifacts/browser-import-integration.json
            browser/artifacts/browser-import-files.json
            browser/artifacts/onboarding-evidence.json
            browser/artifacts/default-links-evidence.json
            browser/artifacts/settings-evidence.json
            browser/artifacts/settings-overlay-evidence.json
            browser/artifacts/settings-overlay-visuals/
