              $_.response.url -match '^https://(?:www\.)?ozon\.ru/' -and $_.response.securityState -eq 'secure'
            }).Count -gt 0 -and
            @($unopened[0].events | Where-Object { $_.event -eq 'Network.loadingFailed' -and !$_.canceled }).Count -eq 0
          if (@($sites).Count -ne 7 -or ($unopened.Count -gt 0 -and !$deferredOzon)) {
            throw 'Publication blocked: one or more required sites did not serve usable content'
          }
          if ($deferredOzon) {
            'Anonymous Ozon access from the GitHub Windows runner returned a secure HTTP 403/429 server rejection. Usable Ozon content and authenticated sessions are not verified. The other six required sites opened successfully; no Ozon TLS or uncancelled network failure was present.' | Add-Content browser/artifacts/release-notes.md -Encoding utf8
          }

      - name: Preserve all verification reports in Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-verification-${{ github.sha }}
          path: |
            browser/artifacts/**
            !browser/artifacts/*.exe
            !browser/artifacts/*.zip
          if-no-files-found: warn

      - name: Publish Soulu release
        if: ${{ !(inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.67')) && (success() && (github.ref == 'refs/tags/beta-1.0.67' || (github.ref == 'refs/heads/main' && (inputs.publish || env.AUTOMATED_RELEASE == 'true'))) && steps.verified.outputs.passed == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-1.0.${{ env.BETA_NUMBER }}
          name: Soulu Beta 1.0.${{ env.BETA_NUMBER }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: browser/artifacts/release-notes.md
          files: |
            browser/artifacts/Soulu-Beta-1.0.${{ env.BETA_NUMBER }}-x64.exe
            browser/artifacts/Soulu-Beta-1.0.${{ env.BETA_NUMBER }}-x64.zip
