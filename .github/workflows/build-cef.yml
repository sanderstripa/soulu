          DEFER_AUTH_CHECKS: ${{ inputs.defer_auth_checks }}
          DEFER_DESKTOP_CHECKS: ${{ inputs.defer_desktop_checks }}
        run: |
          if ($env:AUTOMATED_RELEASE -eq 'true') {
