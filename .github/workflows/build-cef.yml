name: Build Soulu Beta

on:
  workflow_dispatch:
    inputs:
      native_only:
        description: Validate the native runtime without creating an installer
        required: false
        default: false
        type: boolean
      publish:
        description: Publish a release after a successful build
        required: false
        default: false
        type: boolean
      manual_checks_sha:
        description: Final SHA covered by manual acceptance or explicit owner deferrals
        required: false
        default: ""
        type: string
      defer_auth_checks:
        description: Owner explicitly permits this release without real Google/Ozon session checks
        required: false
        default: false
        type: boolean
      defer_desktop_checks:
        description: Owner will complete remaining physical desktop acceptance checks
        required: false
        default: false
        type: boolean
  push:
    branches: [main, codex/settings-overlay, codex/cef-stable-update, codex/beta-motion, codex/beta-typography, codex/beta-toolbar, codex/beta-adblock, codex/beta-site-reader, codex/menu-translate, codex/home-final, codex/window-polish, codex/browser-import-validation]
    tags: [beta-1.0.59]
    paths:
      - "cef/**"
      - "installer/**"
      - "scripts/**"
      - "ui/**"
      - "geometry.json"
      - "typography.json"
      - "vpn/**"
      - ".github/workflows/build-cef.yml"

permissions:
  contents: write
  actions: write

# Only fresh source builds can package or publish.
concurrency:
  group: soulu-cef-main
  cancel-in-progress: true

jobs:
  windows-cef:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      BETA_VERSION: 1.0.59-beta
      BETA_NUMBER: 59
      SOULU_REGRESSION_SKIP_FIRST_RUN: 1
      SOULU_TEST_DEFAULT_APPS: 1
      PYTHONUTF8: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout Soulu
        uses: actions/checkout@v4
        with:
          path: browser

      - name: Verify canonical generated geometry and typography
        shell: pwsh
        run: |
          python browser/scripts/generate-geometry.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/generate-typography.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout official CEF project
        uses: actions/checkout@v4
        with:
          repository: chromiumembedded/cef-project
          ref: 3aec7049cf63a36876d7a6ef538842d6af314482
          path: cef-project

      - name: Pin the approved CEF distribution on a clean path
        shell: pwsh
        run: |
          if ((Test-Path cef-project/third_party/cef) -or (Test-Path cef-build)) {
            throw 'Clean build required: CEF distribution or build directory already exists'
          }
          $index = Invoke-RestMethod 'https://cef-builds.spotifycdn.com/index.json'
          $versions = @($index.windows64.versions | Where-Object {
            $_.cef_version -match '^154\.0\.33\+ga03e714\+chromium-154\.0\.8037\.94$' -and
            $_.chromium_version -eq '154.0.8037.94' -and $_.channel -eq 'stable'
          })
          if ($versions.Count -ne 1) { throw 'Exactly one approved CEF distribution must exist; no fallback allowed' }
          $version = $versions[0].cef_version
          $archive = @($versions[0].files | Where-Object type -eq 'standard')
          if ($archive.Count -ne 1 -or $archive[0].sha1 -cne '66b621e95ccae243621ecb0504803bbdbd2f0777') {
            throw 'Canonical CEF archive checksum changed'
          }
          $cmakeFile = 'cef-project/CMakeLists.txt'
          $cmake = Get-Content $cmakeFile -Raw
          $pattern = 'set\(CEF_VERSION "[^"]+"\)'
          if ([regex]::Matches($cmake, $pattern).Count -ne 1) { throw 'CEF project version declaration changed' }
          $cmake = [regex]::Replace($cmake, $pattern, ('set(CEF_VERSION "' + $version + '")'))
          # Soulu needs the wrapper and examples, not upstream CEF test applications.
          # The project snapshot's test targets are incompatible with this distribution.
          foreach ($target in @('cefclient', 'cefsimple', 'gtest', 'ceftests')) {
            $line = 'add_subdirectory(${CEF_ROOT}/tests/' + $target + ')'
            if (!$cmake.Contains($line)) { throw "Upstream target declaration changed: $target" }
            $cmake = $cmake.Replace($line, '')
          }
          Set-Content $cmakeFile $cmake -Encoding utf8
          # Use the canonical index checksum: the CDN .sha1 sidecar can return
          # an empty response. Keep DownloadCEF's EXPECTED_HASH verification.
          $loaderFile = 'cef-project/cmake/DownloadCEF.cmake'
          $loader = Get-Content $loaderFile -Raw
          $hashDownload = 'file(DOWNLOAD "${CEF_DOWNLOAD_URL_ESCAPED}.sha1" "${CEF_DOWNLOAD_PATH}.sha1")'
          $hashRead = 'file(READ "${CEF_DOWNLOAD_PATH}.sha1" CEF_SHA1)'
          if (!$loader.Contains($hashDownload) -or !$loader.Contains($hashRead)) { throw 'CEF checksum loader changed' }
          $loader = $loader.Replace($hashDownload, '').Replace($hashRead, ('set(CEF_SHA1 "' + $archive[0].sha1 + '")'))
          Set-Content $loaderFile $loader -Encoding utf8
          Write-Host "Pinned CEF distribution: $version"

      - name: Verify canonical typography and bundled fonts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check fonttools
          New-Item -ItemType Directory -Force browser/artifacts | Out-Null
          python browser/scripts/check-typography.py browser/artifacts/typography-static.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build integrity-pinned local translation runtime
        shell: pwsh
        run: |
          python browser/scripts/build-translation-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare integrity-pinned local speech model
        shell: pwsh
        run: |
          python browser/scripts/prepare-home-speech.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add Soulu target and assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force browser/cef/soulu cef-project/examples/soulu
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/ui | Out-Null
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/vpn | Out-Null
          Copy-Item -Recurse -Force browser/ui/* cef-project/examples/soulu/assets/ui/
          Copy-Item -Recurse -Force browser/vpn/* cef-project/examples/soulu/assets/vpn/
          Add-Content cef-project/examples/CMakeLists.txt "`nadd_subdirectory(soulu)`n"

      - name: Use CEF-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CEF Python compatibility package
        shell: pwsh
        run: python -m pip install --disable-pip-version-check six pillow

      - name: Verify all production branding exports
        shell: pwsh
        run: python browser/scripts/verify-branding.py

      - name: Restore compiled Rust dependencies
        id: rust_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            browser/cef/soulu/adblock/target
            cef-build/examples/soulu/adblock
          key: adblock-windows-rust-1.99-${{ hashFiles('browser/cef/soulu/adblock/Cargo.lock', 'browser/cef/soulu/adblock/src/**') }}
          restore-keys: adblock-windows-rust-1.99-

      - name: Compile and test the pinned AdBlock engine
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          cargo test --locked --manifest-path browser/cef/soulu/adblock/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure CEF
        shell: pwsh
        run: |
          cmake -S cef-project -B cef-build -A x64 -DUSE_SANDBOX=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify fresh CEF archive and distribution resources
        shell: pwsh
        run: |
          $archive = Get-ChildItem cef-project/third_party/cef -Filter '*.tar.bz2'
          if (@($archive).Count -ne 1 -or (Get-FileHash $archive.FullName -Algorithm SHA1).Hash.ToLowerInvariant() -cne '66b621e95ccae243621ecb0504803bbdbd2f0777') {
            throw 'Downloaded CEF archive does not match the selected distribution'
          }
          $distribution = Get-ChildItem cef-project/third_party/cef -Directory
          if (@($distribution).Count -ne 1) { throw 'Mixed CEF distributions' }
          Get-ChildItem $distribution.FullName -Recurse -File | Select-Object FullName, Length | ConvertTo-Json | Set-Content cef-distribution-files.json

      - name: Build Soulu
        id: native_build
        shell: pwsh
        run: |
          cmake --build cef-build --config Release --target soulu --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          "build_dir=$($exe.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Save compiled Rust dependencies
        if: steps.native_build.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            browser/cef/soulu/adblock/target
            cef-build/examples/soulu/adblock
          key: ${{ steps.rust_cache.outputs.cache-primary-key }}

      - name: Verify loaded engine and every CEF runtime component
        shell: pwsh
        run: |
          $distribution = Get-ChildItem cef-project/third_party/cef -Directory
          & ./browser/scripts/verify-cef-engine.ps1 -BuildDir $env:build_dir -DistributionDir $distribution.FullName -ReportPath (Join-Path $env:build_dir 'engine-version.json')
          Remove-Item -LiteralPath (Join-Path $env:build_dir 'cef-runtime-list.txt')

      - name: Upload candidate native executable before runtime checks
        if: ${{ always() && steps.native_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-cef-candidate-${{ github.sha }}
          path: |
            ${{ env.build_dir }}/Soulu.exe
            ${{ env.build_dir }}/engine-version.json
            ${{ env.build_dir }}/cef-runtime-manifest.json
            ${{ env.build_dir }}/ui/
            ${{ env.build_dir }}/licenses/
          if-no-files-found: error

      - name: Verify Home before broader development regressions
        if: github.ref == 'refs/heads/codex/home-final' || (github.ref == 'refs/heads/main' && !inputs.native_only)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow numpy soundfile
          $env:SOULU_UI_TEST_PORT = '9223'
          foreach ($suite in @('pages', 'speech', 'design', 'focus', 'migration')) {
            $destination = if ($suite -eq 'design') { 'browser/artifacts/home-early/design' } else { "browser/artifacts/home-early/$suite.json" }
            python "browser/scripts/test-cef-home-$suite.py" "$env:build_dir/Soulu.exe" $destination
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload early Home evidence
        if: (github.ref == 'refs/heads/codex/home-final' || (github.ref == 'refs/heads/main' && !inputs.native_only)) && always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-home-early-${{ github.sha }}
          path: browser/artifacts/home-early/
          if-no-files-found: ignore

      - name: Test work-area input bounds and fullscreen restore in real Win32 CEF
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow
          $env:SOULU_UI_TEST_PORT = '9223'
          python browser/scripts/test-cef-window-states.py "$env:build_dir/Soulu.exe" browser/artifacts/window-states
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test local full-page translation in native CEF
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client
          node browser/scripts/test-translation-unit.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-translation-regression'
          $env:SOULU_UI_TEST_PORT = '9223'
          python browser/scripts/test-cef-translation.py $exe.FullName browser/artifacts/translation-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test unified native menus across contexts and scales
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow comtypes
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $env:SOULU_UI_TEST_PORT = '9223'
          python browser/scripts/test-cef-menu-system.py $exe.FullName browser/artifacts/native-menu-visuals
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-menu-actions.py $exe.FullName browser/artifacts/native-menu-actions.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test real AdBlock request cancellation and cosmetics
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client
          python browser/scripts/test-cef-adblock.py "$env:build_dir/Soulu.exe" browser/artifacts/adblock-controlled.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test HTTPS filter update and last-known-good cache
        shell: pwsh
        run: |
          python browser/scripts/test-cef-adblock-update.py "$env:build_dir/Soulu.exe" browser/artifacts/adblock-update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-adblock-live-update.py "$env:build_dir/Soulu.exe" browser/artifacts/adblock-live-update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test AdBlock across tabs and repeated navigation
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check psutil
          python browser/scripts/test-cef-adblock-lifetime.py "$env:build_dir/Soulu.exe" browser/artifacts/adblock-lifetime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Soulu site permissions and reading palette
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow
          python browser/scripts/test-cef-site-surfaces.py "$env:build_dir/Soulu.exe" browser/artifacts/site-surfaces.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload site surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-site-surfaces-${{ github.sha }}
          path: |
            browser/artifacts/site-surfaces.json
            browser/artifacts/site-surfaces-visuals/
          if-no-files-found: ignore

      - name: Test native web platform, GPU, media and downloads
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pywinauto
          python browser/scripts/test-cef-platform.py "$env:build_dir/Soulu.exe" browser/artifacts/platform-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-platform-${{ github.sha }}
          path: browser/artifacts/platform-evidence.json
          if-no-files-found: ignore

      - name: Test bundled typography in real CEF and RU EN DPI theme matrix
        shell: pwsh
        run: |
          python browser/scripts/test-cef-typography.py "$env:build_dir/Soulu.exe" browser/artifacts/typography-runtime.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native Onest dialog consent and Unicode prompts
        shell: pwsh
        run: |
          python browser/scripts/test-cef-native-typography.py "$env:build_dir/Soulu.exe" browser/artifacts/typography-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload typography evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-typography-${{ github.sha }}
          path: |
            browser/artifacts/typography-static.json
            browser/artifacts/typography-runtime.json
            browser/artifacts/typography-native.json
            browser/artifacts/typography-visuals/
          if-no-files-found: ignore

      - name: Test native history, browsing data clearing and visual layouts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          python browser/scripts/test-cef-history.py $exe.FullName browser/artifacts/history-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload history verification and native visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-history-${{ github.sha }}
          path: |
            browser/artifacts/history-evidence.json
            browser/artifacts/history-visuals/
          if-no-files-found: ignore

      - name: Test native encrypted vault, import and site policy
        shell: pwsh
        run: |
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          python browser/scripts/test-cef-data-security.py $exe.FullName browser/artifacts/data-security.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Browser Import adapters and native bridge on isolated profiles
        shell: pwsh
        run: |
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          python browser/scripts/test-browser-import-native.py $exe.FullName browser/artifacts/browser-import-native.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-browser-import.py $exe.FullName browser/artifacts/browser-import-integration.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-browser-import-files.py $exe.FullName browser/artifacts/browser-import-files.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test immediate settings saves, migration and native profile isolation
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          python browser/scripts/test-cef-settings.py $exe.FullName browser/artifacts/settings-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native Settings overlay lifecycle and background state
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          python browser/scripts/test-cef-settings-overlay.py $exe.FullName browser/artifacts/settings-overlay-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test motion through the native CEF shell and Settings
        shell: pwsh
        run: |
          python browser/scripts/test-cef-motion.py "$env:build_dir/Soulu.exe" browser/artifacts/motion-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test toolbar geometry, caption feedback, popup bounds and native drag
        shell: pwsh
        run: |
          python browser/scripts/test-cef-toolbar.py "$env:build_dir/Soulu.exe" browser/artifacts/toolbar-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload toolbar verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-toolbar-${{ github.sha }}
          path: |
            browser/artifacts/toolbar-evidence.json
            browser/artifacts/toolbar-visuals/
          if-no-files-found: ignore

      - name: Upload motion verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-motion-${{ github.sha }}
          path: |
            browser/artifacts/motion-evidence.json
            browser/artifacts/motion-visuals/
          if-no-files-found: ignore

      - name: Upload settings verification and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-settings-${{ github.sha }}
          path: |
            browser/artifacts/settings-evidence.json
            browser/artifacts/settings-overlay-evidence.json
            browser/artifacts/settings-overlay-visuals/
            browser/artifacts/settings-visuals/
          if-no-files-found: ignore

      - name: Test first-run onboarding in native CEF
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          python browser/scripts/test-cef-onboarding.py $exe.FullName browser/artifacts/onboarding-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test default-browser command-line navigation in native CEF
        shell: pwsh
        run: |
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          python browser/scripts/test-cef-default-links.py $exe.FullName browser/artifacts/default-links-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate native runtime before main packaging
        if: (inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59'))
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow dxcam comtypes
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          & ./browser/scripts/verify-cef-engine.ps1 -BuildDir $exe.Directory.FullName -ReportPath browser/artifacts/engine-version.json
          "build_dir=$($exe.Directory.FullName)" >> $env:GITHUB_ENV
          $env:SOULU_UI_TEST_PORT = '9223'
          python browser/scripts/test-cef-home-pages.py $exe.FullName browser/artifacts/home-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check numpy soundfile
          python browser/scripts/test-cef-home-speech.py $exe.FullName browser/artifacts/home-speech.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-home-design.py $exe.FullName browser/artifacts/home-design
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-home-focus.py $exe.FullName browser/artifacts/home-focus.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-home-migration.py $exe.FullName browser/artifacts/home-migration.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in @('bookmarks-overview', 'site-reader', 'profile-isolation', 'content-policy', 'navigation', 'link-menu', 'storage')) {
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "soulu-native-$suite"
              if ($suite -eq 'link-menu') {
                python "browser/scripts/test-cef-$suite.py" $exe.FullName browser/artifacts/native-menu-visuals
              } else {
                python "browser/scripts/test-cef-$suite.py" $exe.FullName
              }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python browser/scripts/test-cef-layout.py $exe.FullName browser/artifacts/home-layout-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python browser/scripts/test-cef-reader-public.py $exe.FullName browser/artifacts/reader-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-native-public-sites'
          python browser/scripts/test-cef-sites.py $exe.FullName browser/artifacts/sites-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation executable and evidence
        if: (inputs.native_only || (github.ref != 'refs/heads/main' && github.ref != 'refs/tags/beta-1.0.59')) && always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-native-validation-${{ github.sha }}
          path: |
            ${{ env.build_dir }}/Soulu.exe
            ${{ env.build_dir }}/ui/
            ${{ env.build_dir }}/licenses/
