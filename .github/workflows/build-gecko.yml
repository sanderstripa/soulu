name: Soulu Gecko Preview 2
on:
  push:
    branches: [gecko-preview]
    paths: ['gecko/**', '.github/workflows/build-gecko.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: soulu-gecko-preview
  cancel-in-progress: true
jobs:
  windows-gecko:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Prepare checksum-pinned Gecko and original Soulu frontend
        run: python gecko/build.py --platform win64 --output gecko-out
      - name: Select the same Rust toolchain as Soulu CEF
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
      - uses: actions/cache/restore@v4
        id: blocker-cache
        with:
          path: gecko-cache/adblock/target
          key: gecko-blocker-rust199-${{ hashFiles('cef/soulu/adblock/Cargo.lock', 'cef/soulu/adblock/src/lib.rs') }}
      - name: Build the original Soulu Rust adblock engine as a DLL
        run: python gecko/build-adblock.py gecko-out
      - uses: actions/cache/save@v4
        if: always() && steps.blocker-cache.outputs.cache-hit != 'true'
        with:
          path: gecko-cache/adblock/target
          key: gecko-blocker-rust199-${{ hashFiles('cef/soulu/adblock/Cargo.lock', 'cef/soulu/adblock/src/lib.rs') }}
      - name: Build portable launcher
        shell: pwsh
        run: |
          Push-Location gecko/launcher
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o '../../gecko-out/Soulu Gecko Preview 2.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          Pop-Location
      - name: Build helper and test real Xray and Sudoku tunnels
        shell: pwsh
        run: |
          ./scripts/prepare-vpn-components.ps1 -Destination "$env:GITHUB_WORKSPACE/gecko-out/runtime/soulu/vpn"
      - name: Verify the actual Windows Gecko runtime
        shell: pwsh
        run: |
          python -m pip install marionette_driver pillow websocket-client
          python gecko/tests/preview2.py gecko-out/runtime/firefox.exe gecko-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Gecko acceptance failed' }
          Copy-Item gecko-acceptance/acceptance.json gecko-out/acceptance.json
      - name: Compare against the actual published Soulu CEF at equal client sizes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python gecko/tests/visual-cef.py gecko-out/runtime/firefox.exe gecko-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'CEF visual comparison failed' }
          Copy-Item gecko-acceptance/visual-comparison.json gecko-out/visual-comparison.json
          New-Item -ItemType Directory -Force gecko-out/visual-evidence | Out-Null
          Copy-Item gecko-acceptance/*comparison.png gecko-out/visual-evidence/
      - name: Package Preview 2 with explicit verification status
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python -c "import json,pathlib; p=pathlib.Path('gecko-acceptance'); a=json.loads((p/'acceptance.json').read_text()); v=json.loads((p/'visual-comparison.json').read_text()); failures=[k for k,r in a['checks'].items() if not r['passed']]; assert v['passed'], 'Visual comparison must pass'; assert failures in [[],['youtube_public_video_playback']], failures; assert len(a['checks'])>=28, 'Acceptance incomplete'; d=json.loads((p/'youtube-diagnostic.json').read_text()) if failures else {}; assert not failures or ('бот' in d.get('document',{}).get('text','') or 'bot' in d.get('document',{}).get('text','').lower()), 'Unclassified playback failure'; pathlib.Path('gecko-out/VERIFICATION-STATUS.txt').write_text('NOT FULLY VERIFIED: YouTube requires sign-in to confirm not a bot on the Windows CI IP. Actual YouTube playback is unverified. Task remains incomplete. See acceptance.json and youtube-diagnostic.json.' if failures else 'Windows acceptance and visual checks passed.',encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging verification gate failed' }
          Copy-Item gecko-acceptance/acceptance.json gecko-out/acceptance.json
          if (Test-Path gecko-acceptance/youtube-diagnostic.json) { Copy-Item gecko-acceptance/youtube-diagnostic.json gecko-out/ }
          $meta = Get-Content gecko-out/BUILD.json -Raw | ConvertFrom-Json
          $meta | Add-Member -NotePropertyName source_commit -NotePropertyValue $env:GITHUB_SHA -Force
          $meta | ConvertTo-Json -Depth 10 | Set-Content gecko-out/BUILD.json -Encoding utf8NoBOM
          Compress-Archive -Path gecko-out/* -DestinationPath Soulu-Gecko-Preview-2-win64.zip -CompressionLevel Optimal
          (Get-FileHash Soulu-Gecko-Preview-2-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-Gecko-Preview-2-win64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko-acceptance
          path: gecko-acceptance/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('Soulu-Gecko-Preview-2-win64.zip') != '' }}
        with:
          name: Soulu-Gecko-Preview-2-win64
          path: |
            Soulu-Gecko-Preview-2-win64.zip
            SHA256SUMS.txt
      - name: Publish isolated Gecko prerelease
        if: contains(github.event.head_commit.message, '[publish-gecko-2]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @'
          Soulu Gecko Preview 2 — original Soulu HTML/CSS frontend on Gecko.
          Extract the entire ZIP and run Soulu Gecko Preview 2.exe.
          Original adaptive toolbar, Home, history, bookmark management and all 12 settings sections. Native Gecko website processes and sandbox remain enabled. The same Soulu CEF Rust blocker and three filter subscriptions are bundled; no uBlock dependency. Xray/Sudoku cores and helper are bundled. VPN keys use the profile NSS encrypted store.
          See acceptance.json and visual-comparison.json for the actual Windows test results. Screenshot comparison uses the published CEF 1.0.76 binary at equal client sizes.
          Optional page/YouTube translation and CEF-style reader are not ported. Firefox extensions use Firefox's manager; Chrome CRX is unsupported. Automatic Rust filter subscription updates are not enabled in this preview. Physical GPU, multi-monitor DPI and account-specific VPN service quality are not certified by CI.
          Source is isolated on gecko-preview; main is untouched.
          '@
          $notes | Set-Content gecko-release-notes.md -Encoding utf8NoBOM
          gh release view gecko-preview-2 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Preview 2 already exists; never overwrite a published archive' }
          gh release create gecko-preview-2 Soulu-Gecko-Preview-2-win64.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Soulu Gecko Preview 2' --prerelease --notes-file gecko-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Gecko prerelease publication failed' }
