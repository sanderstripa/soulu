name: Soulu Gecko Preview 1
on:
  push:
    branches: [gecko-preview]
    paths: ['gecko/**', '.github/workflows/build-gecko.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: soulu-gecko-preview
  cancel-in-progress: true
jobs:
  windows-gecko:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Prepare checksum-pinned Gecko and signed uBlock
        run: python gecko/build.py --platform win64 --output gecko-out
      - name: Build portable launcher
        shell: pwsh
        run: |
          Push-Location gecko/launcher
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o '../../gecko-out/Soulu Gecko Preview 1.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
          Pop-Location
      - name: Build helper and test real Xray and Sudoku tunnels
        shell: pwsh
        run: |
          ./scripts/prepare-vpn-components.ps1 -Destination "$env:GITHUB_WORKSPACE/gecko-out/runtime/soulu/vpn"
      - name: Verify the actual Windows Gecko runtime
        shell: pwsh
        run: |
          python -m pip install marionette_driver
          python gecko/tests/acceptance.py gecko-out/runtime/firefox.exe gecko-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Gecko acceptance failed' }
          Copy-Item gecko-acceptance/acceptance.json gecko-out/acceptance.json
      - name: Package Preview 1
        shell: pwsh
        run: |
          $meta = Get-Content gecko-out/BUILD.json -Raw | ConvertFrom-Json
          $meta | Add-Member -NotePropertyName source_commit -NotePropertyValue $env:GITHUB_SHA -Force
          $meta | ConvertTo-Json -Depth 10 | Set-Content gecko-out/BUILD.json -Encoding utf8NoBOM
          Compress-Archive -Path gecko-out/* -DestinationPath Soulu-Gecko-Preview-1-win64.zip -CompressionLevel Optimal
          (Get-FileHash Soulu-Gecko-Preview-1-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-Gecko-Preview-1-win64.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gecko-acceptance
          path: gecko-acceptance/
      - uses: actions/upload-artifact@v4
        with:
          name: Soulu-Gecko-Preview-1-win64
          path: |
            Soulu-Gecko-Preview-1-win64.zip
            SHA256SUMS.txt
      - name: Publish isolated Gecko prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @'
          First experimental Gecko-based Soulu distribution for Windows x64.
          Portable ZIP: extract everything, then run Soulu Gecko Preview 1.exe.
          Uses a checksum-pinned official Firefox runtime with local Soulu chrome, the adaptive toolbar, current Soulu settings layout, isolated profiles, signed full uBlock Origin, and bundled Xray/Sudoku cores.
          History, bookmark, permission and password dialogs use Firefox's native UI. Translation, advanced CEF-only controls and Chrome extensions are not ported.
          Windows runtime checks and real local Xray/Sudoku tunnel tests must pass before this archive is published. See bundled acceptance.json and BUILD.json. Public VPN accounts, hardware video playback and physical multi-monitor DPI have not been tested.
          Source lives only on gecko-preview; main is unchanged.
          '@
          $notes | Set-Content gecko-release-notes.md -Encoding utf8NoBOM
          gh release view gecko-preview-1 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Preview 1 already exists; never overwrite a published archive' }
          gh release create gecko-preview-1 Soulu-Gecko-Preview-1-win64.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Soulu Gecko Preview 1' --prerelease --notes-file gecko-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Gecko prerelease publication failed' }
