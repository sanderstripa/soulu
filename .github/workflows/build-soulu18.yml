name: Build and publish Soulu 0.18.0 Preview
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/build-soulu18.yml']
permissions:
  contents: write
concurrency:
  group: soulu-gecko-preview-18
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Verify real Windows mutex ownership and closed-session recovery
        working-directory: gecko/launcher
        run: |
          gofmt -w main.go session_windows.go session_windows_test.go
          go test -v -count=1 .
          if ($LASTEXITCODE) { throw 'Launcher ownership checks failed' }
      - name: Restore published Preview 17 and apply requested Preview 18 fixes
        id: assemble
        shell: pwsh
        run: |
          gh release download soulu-preview-17 -p 'Soulu-0.17.0-Preview-Setup-win64.exe' -D preview17-input
          if ($LASTEXITCODE) { throw 'Preview 17 download failed' }
          python gecko/prepare-preview18.py
          if ($LASTEXITCODE) { throw 'Preview 18 assembly failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Soulu.exe .
          if ($LASTEXITCODE) { throw 'Launcher compilation failed' }
          Pop-Location
          python gecko/brand-engine.py
          if ($LASTEXITCODE) { throw 'Engine branding failed' }
          New-Item -ItemType Directory -Force soulu18-checks | Out-Null
          Copy-Item gecko-out/windows-brand-audit.json,gecko-out/default-bookmarks-audit.json soulu18-checks
          python -c "import json; r=json.load(open('gecko-out/windows-brand-audit.json')); assert r and all(x['iconGroupsMatchSoulu'] for x in r); assert json.load(open('gecko-out/default-bookmarks-audit.json'))['disabled']"
          if ($LASTEXITCODE) { throw 'Branding/default bookmark audit failed' }
          python -m pip install marionette_driver pillow psutil websocket-client
      - name: Build Soulu 0.18.0 Preview installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soulu-0.18.0-Preview-Setup-win64.exe
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ((Get-Item Soulu-0.18.0-Preview-Setup-win64.exe).VersionInfo.ProductVersion -ne '0.18.0.0') { throw 'Installer version mismatch' }
      - name: Verify clean installation, first launch, upgrade and removal
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python gecko/tests/installer18.py Soulu-0.18.0-Preview-Setup-win64.exe soulu18-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soulu18-evidence
          path: soulu18-checks/
      - uses: actions/upload-artifact@v4
        with:
          name: soulu18-verified-installer
          path: |
            Soulu-0.18.0-Preview-Setup-win64.exe
            Soulu-0.18.0-Preview-Setup-win64.exe.build.json
      - name: Publish tested Soulu 0.18.0 Preview installer
        shell: pwsh
        run: |
          python -c "import json,pathlib; paths=['restart18.json','installer18.json']; assert all(json.loads((pathlib.Path('soulu18-checks')/p).read_text())['passed'] for p in paths)"
          if ($LASTEXITCODE) { throw 'Acceptance reports not green' }
          (Get-FileHash Soulu-0.18.0-Preview-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-0.18.0-Preview-Setup-win64.exe' | Set-Content SHA256SUMS.txt
          $branchHead = gh api repos/sanderstripa/soulu/git/ref/heads/gecko-preview --jq '.object.sha'
          if ($branchHead.Trim() -ne $env:GITHUB_SHA) { throw 'A newer source revision superseded this build' }
          gh release create soulu-preview-18 Soulu-0.18.0-Preview-Setup-win64.exe Soulu-0.18.0-Preview-Setup-win64.exe.build.json SHA256SUMS.txt soulu18-checks/restart18.json soulu18-checks/installer18.json --target $env:GITHUB_SHA --title 'Solu Preview 0.18.0' --prerelease --notes 'Soulu Gecko for Windows x64. Native window presentation, profile restart recovery, toolbar defaults and panel animations.'
          if ($LASTEXITCODE) { throw 'Release publication failed' }


