name: Diagnose daily browsing on the compiled candidate
on:
  push:
    branches: [codex/daily-use-check-72]
permissions:
  contents: read
  actions: read
concurrency:
  group: soulu-daily-use-debug
  cancel-in-progress: true
jobs:
  daily-use:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      SOULU_REGRESSION_SKIP_FIRST_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: browser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41287104185
          name: Soulu-cef-candidate-fdd416df211b2252b2aee459a6b6b2d26fdc6671
          path: candidate
      - name: Prepare identical CEF runtime with the freshly compiled candidate
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/sanderstripa/soulu/releases/download/beta-1.0.71/Soulu-Beta-1.0.71-x64.zip' -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'e89c400d5e7b5ac36ff8a52f0eeaff4504e2d34ec3136ea092c79234e541e3e5') { throw 'Baseline runtime archive digest mismatch' }
          Expand-Archive base.zip runtime
          $exe = Get-ChildItem runtime -Filter Soulu.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Runtime executable missing' }
          $runtime = $exe.Directory.FullName
          Copy-Item candidate/* $runtime -Recurse -Force
          Copy-Item browser/ui/renderer.js (Join-Path $runtime 'ui/renderer.js') -Force
          "runtime_dir=$runtime" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content (Join-Path $runtime 'engine-version.json')
      - name: Exercise adaptive profile transitions repeatedly
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow comtypes pywinauto
          foreach ($attempt in 1..5) {
            python browser/scripts/test-cef-adaptive-toolbar.py "$env:runtime_dir/Soulu.exe" "browser/artifacts/adaptive-$attempt.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python browser/scripts/test-cef-settings.py "$env:runtime_dir/Soulu.exe" browser/artifacts/settings-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-use-debug
          path: |
            browser/artifacts/
            candidate/engine-version.json
          if-no-files-found: warn
      - name: Stop test processes
        if: always()
        shell: pwsh
        run: Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
