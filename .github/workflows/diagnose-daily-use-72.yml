name: Diagnose daily browsing on the compiled candidate
on:
  push:
    branches: [codex/daily-use-check-72]
permissions:
  contents: read
  actions: read
concurrency:
  group: soulu-daily-use-debug
  cancel-in-progress: true
jobs:
  daily-use:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      SOULU_REGRESSION_SKIP_FIRST_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: browser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 41319039626
          name: Soulu-cef-candidate-37932f041f89dc169ef5ff39769413edb1f0c681
          path: candidate
      - name: Prepare identical CEF runtime with the freshly compiled candidate
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/sanderstripa/soulu/releases/download/beta-1.0.72/Soulu-Beta-1.0.72-x64.zip' -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '1fd4cf4984d285c02a532ee60b6f2345b7a99b31570058cb8c3312fef53bae4b') { throw 'Baseline runtime archive digest mismatch' }
          Expand-Archive base.zip runtime
          $exe = Get-ChildItem runtime -Filter Soulu.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw 'Runtime executable missing' }
          $runtime = $exe.Directory.FullName
          Copy-Item candidate/* $runtime -Recurse -Force
          Copy-Item browser/ui/renderer.js (Join-Path $runtime 'ui/renderer.js') -Force
          "runtime_dir=$runtime" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content (Join-Path $runtime 'engine-version.json')
      - name: Diagnose lifecycle policy
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow comtypes pywinauto
          python browser/scripts/test-cef-polish-performance.py "$env:runtime_dir/Soulu.exe" browser/artifacts/polish-performance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-use-debug
          path: |
            browser/artifacts/
            candidate/engine-version.json
          if-no-files-found: warn
      - name: Stop test processes
        if: always()
        shell: pwsh
        run: Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
