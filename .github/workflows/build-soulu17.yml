name: Build and publish Soulu 0.17.0 Preview
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/build-soulu17.yml']
permissions:
  contents: write
  actions: write
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Cancel superseded Preview 17 checks
        shell: pwsh
        run: |
          $runs = gh run list --workflow build-soulu17.yml --branch gecko-preview --limit 30 --json databaseId,status | ConvertFrom-Json
          foreach ($old in $runs) { if ([long]$old.databaseId -lt [long]$env:GITHUB_RUN_ID -and $old.status -in @('in_progress','queued')) { gh run cancel $old.databaseId } }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Verify real Windows mutex ownership and closed-session recovery
        working-directory: gecko/launcher
        run: |
          gofmt -w main.go session_windows.go session_windows_test.go
          go test -v -count=1 .
          if ($LASTEXITCODE) { throw 'Launcher ownership checks failed' }
      - name: Restore published Preview 16 and apply requested Preview 17 fixes
        id: assemble
        shell: pwsh
        run: |
          $run = gh run view 42041323027 --json conclusion,headSha | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.headSha -ne 'd69b3cab0d8939d29f6a35d21099d05cb8967d30') { throw 'Preview 12 provenance mismatch' }
          gh run download 42041323027 -n soulu16-verified-installer -D preview16-input
          if ($LASTEXITCODE) { throw 'Verified Preview 12 download failed' }
          python gecko/prepare-preview17.py
          if ($LASTEXITCODE) { throw 'Preview 17 assembly failed' }
          Push-Location gecko/launcher
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0 -64 -o rsrc.syso
          if ($LASTEXITCODE) { throw 'Launcher resources failed' }
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../../gecko-out/Soulu.exe .
          if ($LASTEXITCODE) { throw 'Launcher compilation failed' }
          Pop-Location
          python gecko/brand-engine.py
          if ($LASTEXITCODE) { throw 'Engine branding failed' }
          New-Item -ItemType Directory -Force soulu17-checks | Out-Null
          Copy-Item gecko-out/windows-brand-audit.json,gecko-out/default-bookmarks-audit.json soulu17-checks
          python -c "import json; r=json.load(open('gecko-out/windows-brand-audit.json')); assert r and all(x['iconGroupsMatchSoulu'] for x in r); assert json.load(open('gecko-out/default-bookmarks-audit.json'))['disabled']"
          if ($LASTEXITCODE) { throw 'Branding/default bookmark audit failed' }
          python -m pip install marionette_driver pillow psutil websocket-client
      - name: Reproduce Preview 16 busy error with an unowned retained mutex
        run: python gecko/tests/busy17.py baseline16 soulu17-checks
      - name: Verify four native launches of Preview 17
        run: python gecko/tests/restart17.py gecko-out soulu17-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soulu17-native-evidence
          path: |
            soulu17-checks/

      - name: Build Soulu 0.17.0 Preview installer
        id: installer
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        shell: pwsh
        run: |
          ./gecko/installer/build.ps1 -BuildDir gecko-out -OutFile Soulu-0.17.0-Preview-Setup-win64.exe
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          if ((Get-Item Soulu-0.17.0-Preview-Setup-win64.exe).VersionInfo.ProductVersion -ne '0.17.0.0') { throw 'Installer version mismatch' }
      - name: Verify clean installation, first launch, upgrade and removal
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        run: python gecko/tests/installer17.py Soulu-0.17.0-Preview-Setup-win64.exe soulu17-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soulu17-evidence
          path: soulu17-checks/
      - uses: actions/upload-artifact@v4
        with:
          name: soulu17-verified-installer
          path: |
            Soulu-0.17.0-Preview-Setup-win64.exe
            Soulu-0.17.0-Preview-Setup-win64.exe.build.json
      - name: Publish tested Soulu 0.17.0 Preview installer
        shell: pwsh
        run: |
          python -c "import json,pathlib; paths=['restart17.json','installer17.json','busy17.json']; assert all(json.loads((pathlib.Path('soulu17-checks')/p).read_text())['passed'] for p in paths)"
          if ($LASTEXITCODE) { throw 'Acceptance reports not green' }
          (Get-FileHash Soulu-0.17.0-Preview-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-0.17.0-Preview-Setup-win64.exe' | Set-Content SHA256SUMS.txt
          $branchHead = gh api repos/sanderstripa/soulu/git/ref/heads/gecko-preview --jq '.object.sha'
          if ($branchHead.Trim() -ne $env:GITHUB_SHA) { throw 'A newer source revision superseded this build' }
          gh release create soulu-preview-17 Soulu-0.17.0-Preview-Setup-win64.exe Soulu-0.17.0-Preview-Setup-win64.exe.build.json SHA256SUMS.txt soulu17-checks/restart17.json soulu17-checks/installer17.json soulu17-checks/busy17.json --target $env:GITHUB_SHA --title 'Soulu 0.17.0 Preview' --prerelease --notes-file gecko/docs/PREVIEW17-RESULTS.md
          if ($LASTEXITCODE) { throw 'Release publication failed' }


# Verify the updater version by importing the generated module.

# Defer heavy background initialization until paint, without hiding the window.

# Native focus validates the executable file identity, including Windows short paths.
