name: Publish exact verified Soulu Gecko Preview 8 installer
on:
  push:
    branches: [gecko-preview]
    paths: ['.github/workflows/publish-gecko8.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: sanderstripa/soulu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve the exact tested installer and reports
        shell: pwsh
        run: |
          foreach ($id in @(41834119852,41834120080)) {
            $run = gh run view $id --json conclusion,headSha | ConvertFrom-Json
            if ($run.conclusion -ne 'success' -or $run.headSha -ne 'a94114bd475eadeed99703faec0c4c4df3214ec3') { throw 'Verified source run mismatch' }
          }
          gh run download 41834120080 -n gecko8-verified-installer -D package
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          gh run download 41834120080 -n gecko8-installer-evidence -D installer-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Installer evidence download failed' }
          gh run download 41834119852 -n gecko8-targeted-evidence -D browser-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Browser evidence download failed' }
          python -c "import json,pathlib,hashlib; reports=[pathlib.Path('installer-evidence/installer8.json'),*[pathlib.Path('browser-evidence')/x for x in ['startup8.json','ui8.json','firstframe7.json']]]; assert all((d:=json.loads(p.read_text()))['passed'] and all(x['passed'] for x in d['checks'].values()) for p in reports); p=pathlib.Path('package/Soulu-Gecko-Preview-8-Setup-win64.exe'); b=json.loads(pathlib.Path(str(p)+'.build.json').read_text(encoding='utf-8-sig')); assert b['sourceCommit']=='a94114bd475eadeed99703faec0c4c4df3214ec3' and b['version']=='0.8.0-preview8' and b['installerSHA256']==hashlib.sha256(p.read_bytes()).hexdigest()"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence or binary integrity validation failed' }
          if ((Get-Item package/Soulu-Gecko-Preview-8-Setup-win64.exe).VersionInfo.ProductVersion -ne '0.8.0.0') { throw 'Incorrect installer version' }
          Copy-Item browser-evidence/firstframe7.json package/firstframe8.json
          (Get-FileHash package/Soulu-Gecko-Preview-8-Setup-win64.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  Soulu-Gecko-Preview-8-Setup-win64.exe' | Set-Content package/SHA256SUMS.txt
      - name: Publish verified installer, reports and screenshots
        shell: pwsh
        run: |
          gh release create gecko-preview-8 package/Soulu-Gecko-Preview-8-Setup-win64.exe package/Soulu-Gecko-Preview-8-Setup-win64.exe.build.json package/SHA256SUMS.txt browser-evidence/startup8.json browser-evidence/ui8.json package/firstframe8.json installer-evidence/installer8.json browser-evidence/addons8.png installer-evidence/installer-welcome.png installer-evidence/installer-finish.png gecko/docs/PREVIEW8-RESULTS.md --target $env:GITHUB_SHA --title "Soulu Gecko Preview 8" --prerelease --notes-file gecko/docs/PREVIEW8-RESULTS.md
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
