<div id="soulu-classic-review">
  <section class="sl-window" aria-label="Soulu — классическая панель">
    <header class="sl-chrome">
      <div class="sl-navigation">
        <div class="sl-left">
          <button class="sl-icon cursor-interaction" data-command="sidebar" aria-label="Список вкладок" aria-expanded="false"><i data-lucide="panel-left" aria-hidden="true"></i></button>
          <span class="sl-navigation-divider"></span>
          <button class="sl-icon cursor-interaction" data-command="back" aria-label="Назад" disabled><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <button class="sl-icon sl-forward cursor-interaction" data-command="forward" aria-label="Вперёд" disabled><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        </div>
        <form class="sl-address" aria-label="Адрес и поиск">
          <button type="button" class="sl-icon cursor-interaction" data-command="menu" aria-label="Меню страницы" aria-expanded="false"><i data-lucide="align-left" aria-hidden="true"></i></button>
          <input aria-label="Поиск или адрес сайта" autocomplete="off" spellcheck="false" placeholder="Поиск или адрес сайта">
          <button type="button" class="sl-icon sl-star cursor-interaction" data-command="favorite" aria-label="Добавить в избранное" aria-pressed="false"><i data-lucide="star" aria-hidden="true"></i></button>
          <button type="button" class="sl-icon cursor-interaction" data-command="reload" aria-label="Обновить страницу"><i data-lucide="rotate-cw" aria-hidden="true"></i></button>
        </form>
        <div class="sl-right">
          <button class="sl-icon sl-theme cursor-interaction" data-command="theme" aria-label="Сменить тему"><i data-lucide="sun-moon" aria-hidden="true"></i></button>
          <button class="sl-icon cursor-interaction" data-command="new" aria-label="Новая вкладка"><i data-lucide="plus" aria-hidden="true"></i></button>
          <button class="sl-icon cursor-interaction" data-command="overview" aria-label="Обзор вкладок" aria-expanded="false"><i data-lucide="panels-top-left" aria-hidden="true"></i></button>
          <div class="sl-captions" aria-hidden="true"><span><i data-lucide="minus"></i></span><span><i data-lucide="square"></i></span><span><i data-lucide="x"></i></span></div>
        </div>
      </div>
      <div class="sl-tab-row">
        <div class="sl-pins" role="tablist" aria-label="Закреплённые вкладки"></div>
        <span class="sl-tab-divider"></span>
        <div class="sl-tabs" role="tablist" aria-label="Открытые вкладки"></div>
      </div>
    </header>
    <main class="sl-page" aria-live="polite"></main>
    <aside class="sl-sidebar" aria-label="Открытые вкладки" hidden></aside>
    <div class="sl-overview" hidden></div>
    <div class="sl-menu" role="menu" hidden></div>
    <div class="sl-toast" role="status" hidden></div>
  </section>
</div>
<style>
@font-face{font-family:SouluReviewOnest;src:url(../../ui/fonts/Onest-Regular.ttf) format("truetype");font-weight:400;font-display:swap}

#soulu-classic-review{color-scheme:light dark;--sl-chrome:light-dark(#f6f6f8,#191a1e);--sl-page:light-dark(#fff,#0d0e11);--sl-text:light-dark(#303137,#ececf0);--sl-muted:light-dark(#7d7f87,#a3a5ae);--sl-rule:light-dark(#dedee3,#32343b);--sl-pill:light-dark(#e9e9ed,#2b2c33);--sl-pill-hover:light-dark(#dedee5,#383a43);--sl-active:light-dark(#fff,#494b55);--sl-active-rule:light-dark(#d0d1d8,#60636f);--sl-field:light-dark(#fdfdfe,#282a30);--sl-shadow:light-dark(#26293b12,#00000032);--sl-focus:#478cee;--sl-blue:#1775db;--sl-content:light-dark(#f7f8fa,#191b21);font-family:SouluReviewOnest,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--sl-text);width:100%;font-size:13px;line-height:1.45}
#soulu-classic-review *{box-sizing:border-box}
#soulu-classic-review button,#soulu-classic-review input{font:inherit;color:inherit}
#soulu-classic-review button{border:0;background:transparent}
#soulu-classic-review button:focus-visible,#soulu-classic-review input:focus-visible{outline:2px solid var(--sl-focus);outline-offset:-2px}
#soulu-classic-review [hidden]{display:none!important}
#soulu-classic-review .sl-window{position:relative;isolation:isolate;border:1px solid var(--sl-rule);border-radius:13px;overflow:hidden;background:var(--sl-page);min-width:0}
#soulu-classic-review .sl-chrome{background:var(--sl-chrome);border-bottom:1px solid var(--sl-rule);user-select:none;position:relative;z-index:5}
#soulu-classic-review .sl-navigation{height:46px;display:grid;grid-template-columns:minmax(130px,1fr) minmax(100px,640px) minmax(130px,1fr);align-items:center;gap:20px;padding:0 10px}
#soulu-classic-review .sl-left,#soulu-classic-review .sl-right{display:flex;align-items:center;gap:3px;min-width:0}
#soulu-classic-review .sl-right{justify-content:flex-end}
#soulu-classic-review .sl-icon{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:50%;padding:0}
#soulu-classic-review .sl-icon:hover{background:var(--sl-pill)}
#soulu-classic-review .sl-icon:disabled{opacity:.3}
#soulu-classic-review .sl-icon:disabled:hover{background:transparent}
#soulu-classic-review .sl-icon svg{width:18px;height:18px;stroke-width:1.5}
#soulu-classic-review .sl-navigation-divider{height:17px;width:1px;background:var(--sl-rule);margin:0 5px}
#soulu-classic-review .sl-address{min-width:0;display:flex;align-items:center;height:32px;padding:0 3px;border-radius:999px;background:var(--sl-field);border:1px solid var(--sl-rule);box-shadow:0 1px 3px var(--sl-shadow)}
#soulu-classic-review .sl-address:focus-within{border-color:var(--sl-focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--sl-focus) 14%,transparent)}
#soulu-classic-review .sl-address .sl-icon{width:27px;height:27px;flex-basis:27px;color:var(--sl-muted)}
#soulu-classic-review .sl-address .sl-icon svg{width:15px;height:15px}
#soulu-classic-review .sl-address input{min-width:0;width:100%;height:100%;border:0;background:transparent;outline:none;text-align:center;padding:0 8px;text-overflow:ellipsis;font-size:12px}
#soulu-classic-review .sl-address input:focus{text-align:left;outline:none}
#soulu-classic-review .sl-address input::placeholder{color:var(--sl-muted)}
#soulu-classic-review .sl-star[aria-pressed=true]{color:var(--sl-blue)}
#soulu-classic-review .sl-star[aria-pressed=true] svg{fill:color-mix(in srgb,var(--sl-blue) 15%,transparent)}
#soulu-classic-review .sl-captions{display:flex;align-items:center;margin-left:12px;height:46px}
#soulu-classic-review .sl-captions span{display:grid;place-items:center;width:42px;height:46px}
#soulu-classic-review .sl-captions svg{height:13px;width:13px;stroke-width:1.5}
#soulu-classic-review .sl-tab-row{display:flex;gap:8px;height:36px;padding:1px 10px 5px;align-items:center;min-width:0}
#soulu-classic-review .sl-pins{display:flex;align-items:center;gap:4px;flex:0 0 auto;max-width:42%;overflow:auto;scrollbar-width:none}
#soulu-classic-review .sl-pins:empty{display:none}
#soulu-classic-review .sl-tab-divider{width:1px;height:17px;background:var(--sl-rule);flex:0 0 1px;margin:0 1px}
#soulu-classic-review .sl-pins:empty+.sl-tab-divider{display:none}
#soulu-classic-review .sl-tabs{display:flex;align-items:center;gap:5px;min-width:0;flex:1;overflow:auto;scrollbar-width:none;scroll-behavior:smooth}
#soulu-classic-review .sl-tab{display:flex;align-items:center;gap:7px;position:relative;flex:1 0 112px;max-width:240px;height:30px;min-width:0;padding:0 7px 0 10px;border:1px solid transparent;border-radius:999px;background:var(--sl-pill);color:var(--sl-muted);transition:background .14s,box-shadow .14s}
#soulu-classic-review .sl-tab:hover{background:var(--sl-pill-hover);color:var(--sl-text)}
#soulu-classic-review .sl-tab[aria-selected=true]{background:var(--sl-active);border-color:var(--sl-active-rule);color:var(--sl-text);box-shadow:0 1px 3px var(--sl-shadow)}
#soulu-classic-review .sl-tab-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:12px;text-align:left}
#soulu-classic-review .sl-tab-select{position:absolute;inset:0;border-radius:inherit;z-index:1}
#soulu-classic-review .sl-tab .sl-close{position:relative;z-index:2;display:grid;place-items:center;width:21px;height:21px;flex:0 0 21px;border-radius:50%;padding:0;opacity:0;color:var(--sl-muted)}
#soulu-classic-review .sl-tab:hover .sl-close,#soulu-classic-review .sl-tab:focus-within .sl-close,#soulu-classic-review .sl-tab[aria-selected=true] .sl-close{opacity:1}
#soulu-classic-review .sl-close:hover{background:var(--sl-pill-hover);color:var(--sl-text)}
#soulu-classic-review .sl-close svg{width:12px;height:12px;stroke-width:1.6}
#soulu-classic-review .sl-pin{width:30px;height:30px;flex:0 0 30px;padding:0;display:grid;place-items:center;border-radius:50%;border:1px solid transparent;background:var(--sl-pill)}
#soulu-classic-review .sl-pin:hover{background:var(--sl-pill-hover)}
#soulu-classic-review .sl-pin[aria-selected=true]{background:var(--sl-active);border-color:var(--sl-active-rule);box-shadow:0 1px 3px var(--sl-shadow)}
#soulu-classic-review .sl-favicon{display:inline-grid;place-items:center;flex:0 0 16px;width:16px;height:16px;font-size:11px;font-weight:600;line-height:1;border-radius:4px;letter-spacing:-.4px;overflow:hidden}
#soulu-classic-review .sl-favicon:has(img){background:transparent}
#soulu-classic-review .sl-favicon.github:has(img),#soulu-classic-review .sl-favicon.apple:has(img){background:#fff;border-radius:50%}
#soulu-classic-review .sl-favicon img{width:100%;height:100%;object-fit:contain}
#soulu-classic-review .sl-favicon.youtube{background:#f2253f;color:white;font-size:9px;border-radius:5px}
#soulu-classic-review .sl-favicon.telegram{background:#29a5df;color:white;border-radius:50%}
#soulu-classic-review .sl-favicon.google{color:#4285f4;background:transparent;font-size:17px;letter-spacing:-1px}
#soulu-classic-review .sl-favicon.mail{background:#237de5;color:white}
#soulu-classic-review .sl-favicon.apple{color:var(--sl-text);font-size:15px;background:transparent}
#soulu-classic-review .sl-favicon.github{background:light-dark(#303139,#e4e5eb);color:light-dark(#fff,#202127);border-radius:50%;font-size:8px;letter-spacing:-.7px}
#soulu-classic-review .sl-favicon.icloud{background:transparent;color:#269ce7;font-size:17px}
#soulu-classic-review .sl-favicon.figma{background:#a259ff;color:white;border-radius:5px}
#soulu-classic-review .sl-favicon.booking{background:#073b87;color:white;letter-spacing:-1px}
#soulu-classic-review .sl-page{position:relative;min-height:510px;background:var(--sl-page);overflow:hidden}
#soulu-classic-review .sl-home{min-height:510px;display:flex;flex-direction:column;align-items:center;padding:119px 24px 90px;gap:39px}
#soulu-classic-review .sl-logo{width:102px;height:102px;object-fit:contain}
#soulu-classic-review .sl-search{display:flex;align-items:center;gap:17px;width:min(620px,100%);height:48px;padding:0 18px;border:1px solid var(--sl-rule);border-radius:999px;box-shadow:0 8px 35px var(--sl-shadow);background:var(--sl-content)}
#soulu-classic-review .sl-search input{min-width:0;flex:1;border:0;background:transparent;outline:none;font-size:14px}
#soulu-classic-review .sl-search input::placeholder{color:var(--sl-muted)}
#soulu-classic-review .sl-search .sl-favicon{width:22px;flex-basis:22px;height:22px;font-size:24px}
#soulu-classic-review .sl-search .sl-search-divider{height:22px;width:1px;background:var(--sl-rule)}
#soulu-classic-review .sl-search svg{width:18px;height:18px;color:var(--sl-muted)}
#soulu-classic-review .sl-site{padding:30px 7% 70px;min-height:510px}
#soulu-classic-review .sl-site-nav{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--sl-rule);padding-bottom:20px;font-size:12px;color:var(--sl-muted);flex-wrap:wrap}
#soulu-classic-review .sl-site-nav strong{margin-right:auto;font-size:15px;color:var(--sl-text);font-weight:500}
#soulu-classic-review .sl-site h1{font-size:36px;font-weight:500;letter-spacing:-1.4px;line-height:1.12;margin:66px 0 14px;color:var(--sl-text)}
#soulu-classic-review .sl-site p{font-size:15px;color:var(--sl-muted);max-width:560px}
#soulu-classic-review .sl-site .sl-kicker{color:var(--sl-blue);font-size:12px;margin-top:50px}
#soulu-classic-review .sl-site .sl-kicker+h1{margin-top:12px}
#soulu-classic-review .sl-tiles{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
#soulu-classic-review .sl-tile{padding:20px;min-width:130px;flex:1;border-radius:16px;background:var(--sl-content);border:1px solid var(--sl-rule);max-width:240px}
#soulu-classic-review .sl-tile small{display:block;color:var(--sl-muted);margin-top:7px;font-size:11px}
#soulu-classic-review .sl-code{font:12px/1.8 ui-monospace,SFMono-Regular,monospace;padding:24px;margin-top:26px;background:var(--sl-content);border:1px solid var(--sl-rule);border-radius:12px;white-space:pre-wrap;color:var(--sl-muted)}
#soulu-classic-review .sl-sidebar{position:absolute;top:82px;bottom:0;left:0;width:min(280px,85%);padding:18px 10px;background:var(--sl-chrome);border-right:1px solid var(--sl-rule);z-index:8;box-shadow:10px 0 30px var(--sl-shadow);overflow:auto}
#soulu-classic-review .sl-sidebar header{padding:0 10px 16px;font-size:15px;font-weight:500}
#soulu-classic-review .sl-side-row{display:flex;align-items:center;gap:8px;padding:5px;border-radius:9px;margin-bottom:4px}
#soulu-classic-review .sl-side-row.is-active{background:var(--sl-pill)}
#soulu-classic-review .sl-side-switch{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:8px 5px;text-align:left}
#soulu-classic-review .sl-side-switch span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#soulu-classic-review .sl-side-row .sl-icon{color:var(--sl-muted)}
#soulu-classic-review .sl-side-row .sl-icon.is-pinned{color:var(--sl-blue)}
#soulu-classic-review .sl-overview{position:absolute;inset:82px 0 0;padding:26px;z-index:9;background:var(--sl-page);overflow:auto}
#soulu-classic-review .sl-overview header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:18px}
#soulu-classic-review .sl-overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
#soulu-classic-review .sl-overview-item{min-height:112px;border:1px solid var(--sl-rule);border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:20px;background:var(--sl-content);text-align:left}
#soulu-classic-review .sl-overview-item[aria-current=true]{border-color:var(--sl-focus)}
#soulu-classic-review .sl-menu{position:absolute;z-index:20;top:43px;left:24%;width:220px;padding:5px;background:var(--sl-field);border:1px solid var(--sl-rule);border-radius:12px;box-shadow:0 10px 36px var(--sl-shadow)}
#soulu-classic-review .sl-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:7px;text-align:left;font-size:12px}
#soulu-classic-review .sl-menu button:hover{background:var(--sl-pill)}
#soulu-classic-review .sl-menu svg{width:15px;height:15px}
#soulu-classic-review .sl-menu hr{height:1px;border:0;background:var(--sl-rule);margin:4px 6px}
#soulu-classic-review .sl-toast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);max-width:90%;padding:9px 16px;border:1px solid var(--sl-rule);border-radius:999px;background:var(--sl-field);color:var(--sl-muted);font-size:12px;z-index:25;box-shadow:0 4px 20px var(--sl-shadow);text-align:center}
#soulu-classic-review .sl-reloading svg{animation:sl-spin .65s linear}
@keyframes sl-spin{to{transform:rotate(360deg)}}
@media(max-width:1150px){#soulu-classic-review .sl-captions{display:none}#soulu-classic-review .sl-navigation{grid-template-columns:minmax(110px,1fr) minmax(100px,640px) minmax(110px,1fr);gap:14px;padding-inline:9px}}
@media(max-width:600px){#soulu-classic-review .sl-navigation{grid-template-columns:64px minmax(90px,1fr) 64px;gap:7px;padding-inline:6px}#soulu-classic-review .sl-forward,#soulu-classic-review .sl-navigation-divider,#soulu-classic-review .sl-theme{display:none}#soulu-classic-review .sl-address .sl-star{display:none}#soulu-classic-review .sl-tab-row{gap:6px;padding-inline:7px}#soulu-classic-review .sl-home{padding-top:100px;min-height:470px}#soulu-classic-review .sl-page{min-height:470px}#soulu-classic-review .sl-search{gap:10px;padding-inline:12px}#soulu-classic-review .sl-search input{font-size:16px}#soulu-classic-review .sl-address input{font-size:16px;padding-inline:2px}#soulu-classic-review .sl-menu{left:8px}#soulu-classic-review .sl-site h1{font-size:30px}#soulu-classic-review .sl-tile{min-width:110px}#soulu-classic-review .sl-overview{padding:16px}}
@media(pointer:coarse){#soulu-classic-review .sl-navigation{height:52px}#soulu-classic-review .sl-tab-row{height:44px;padding-bottom:6px}#soulu-classic-review .sl-pin{width:36px;height:36px;flex-basis:36px}#soulu-classic-review .sl-pins{gap:8px}#soulu-classic-review .sl-tab{height:36px;flex-basis:135px}#soulu-classic-review .sl-tab .sl-close{opacity:1}#soulu-classic-review .sl-sidebar{top:96px}#soulu-classic-review .sl-overview{top:96px}#soulu-classic-review .sl-menu button{min-height:44px}}
@media(prefers-reduced-motion:reduce){#soulu-classic-review *{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script>
(()=>{
  const root=document.getElementById('soulu-classic-review');
  const $=s=>root.querySelector(s);
  const logo='../../ui/branding/soulu-128.png';
  const tabs=[
    {id:1,title:'YouTube',url:'youtube.com',kind:'youtube',pin:true},
    {id:2,title:'Telegram',url:'web.telegram.org',kind:'telegram',pin:true},
    {id:3,title:'Google',url:'google.com',kind:'google',pin:true},
    {id:4,title:'Почта',url:'mail.google.com',kind:'mail',pin:true},
    {id:5,title:'Soulu',url:'',kind:'soulu'},
    {id:6,title:'Apple Store',url:'apple.com',kind:'apple'},
    {id:7,title:'Проект Soulu · GitHub',url:'github.com/sanderstripa/soulu',kind:'github'},
    {id:8,title:'iCloud',url:'icloud.com',kind:'icloud'},
    {id:9,title:'Figma · Концепции',url:'figma.com/design/soulu',kind:'figma'},
    {id:10,title:'Booking.com',url:'booking.com',kind:'booking'}
  ];

  function notify(text){clearTimeout(toastTimer);$('.sl-toast').textContent=text;$('.sl-toast').hidden=false;toastTimer=setTimeout(()=>$('.sl-toast').hidden=true,1800)}
  function closeMenu(){$('.sl-menu').hidden=true;$('[data-command=menu]').setAttribute('aria-expanded','false')}
  function select(id){active=id;closeMenu();$('.sl-overview').hidden=true;$('.sl-sidebar').hidden=true;render();const t=root.querySelector(`[data-id="${id}"]`);if(t&&!current().pin)t.scrollIntoView({block:'nearest',inline:'nearest'})}
  function closeTab(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;tabs.splice(i,1);if(!tabs.length)tabs.push({id:nextId++,title:'Новая вкладка',url:'',kind:'soulu'});if(active===id)active=tabs[Math.max(0,i-1)]?.id||tabs[0].id;closeMenu();render()}
  function pin(id){const t=tabs.find(t=>t.id===id);if(!t)return;t.pin=!t.pin;closeMenu();render();notify(t.pin?'Вкладка закреплена':'Вкладка откреплена')}
  function newTab(){const t={id:nextId++,title:'Новая вкладка',url:'',kind:'soulu'};tabs.push(t);select(t.id);$('.sl-address input').focus()}
  function theme(){const dark=root.style.colorScheme?root.style.colorScheme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.style.colorScheme=dark?'light':'dark';closeMenu()}
  function navigate(value){value=value.trim();if(!value)return;const t=current();if(!t.history)t.history=[{url:t.url,title:t.title,kind:t.kind}];t.position=t.position??0;t.history.splice(t.position+1);let url=value,kind='search',title=value;if(/^(https?:\/\/)?[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(value)){url=value.replace(/^https?:\/\//,'');const found=tabs.find(x=>x.url&&url.includes(x.url.split('/')[0]));kind=found?.kind||'site';title=found?.title||url.split('/')[0]}else{url='google.com/search?q='+encodeURIComponent(value)}t.history.push({url,title,kind});t.position++;Object.assign(t,{url,title,kind});render()}
  function travel(dir){const t=current();if(!t.history)return;const pos=t.position+dir;if(pos<0||pos>=t.history.length)return;t.position=pos;Object.assign(t,t.history[pos]);render()}
  function page(t){if(t.kind==='soulu')return `<div class="sl-home"><img class="sl-logo" src="${logo}" alt="Soulu"><form class="sl-search" aria-label="Поиск Google"><span class="sl-favicon google" aria-hidden="true">G</span><span class="sl-search-divider"></span><input aria-label="Поисковый запрос" placeholder="Введите поисковый запрос или URL"><span aria-hidden="true">${icon('mic')}</span></form></div>`;
    const content={apple:['Apple Store','Магазин','Mac','Откройте для себя новое.','Всё, что вы любите. В одном месте.',['Mac','iPad','iPhone']],github:['sanderstripa / soulu','Code','Issues','Soulu','Лёгкий браузер для Windows. На вашем движке привычек.',['Code','Releases','README']],icloud:['iCloud','Почта','Фото','Всё важное. Всегда рядом.','Ваши приложения и файлы — в одном пространстве.',['Почта','Фото','iCloud Drive']],figma:['Figma','Design','Prototype','Пространство для идей.','Концепции, детали и следующий шаг.',['Classic toolbar','Pinned tabs','Components']],booking:['Booking.com','Жильё','Авиабилеты','Куда отправимся дальше?','Найдите место для следующего путешествия.',['Горы','Город','Море']],youtube:['YouTube','Главная','Подписки','Что посмотрим?','Видео, музыка и новые открытия.',['Для вас','Технологии','Музыка']],telegram:['Telegram','Чаты','Контакты','Ваши разговоры.','Сообщения, каналы и сообщества.',['Чаты','Избранное','Каналы']],mail:['Почта','Входящие','Избранное','Хорошего дня.','Письма и задачи — всё на своих местах.',['Входящие','Отправленные','Черновики']],google:['Google','Поиск','Картинки','Что найдём сегодня?','Введите запрос в адресную строку.',['Поиск','Картинки','Карты']]};
    const c=content[t.kind]||[t.kind==='search'?'Google':t.title,'Обзор','Информация',t.kind==='search'?t.title:t.url,'Демонстрационная страница',['Результаты','Материалы','Ссылки']];
    return `<div class="sl-site"><nav class="sl-site-nav"><strong>${esc(c[0])}</strong><span>${esc(c[1])}</span><span>${esc(c[2])}</span></nav><div class="sl-kicker">${esc(t.url.split('?')[0])}</div><h1>${esc(c[3])}</h1><p>${esc(c[4])}</p>${t.kind==='github'?'<div class="sl-code">Soulu Beta 1.0.62<br>CEF 156.0.14 · Chromium 156.0.8078.48<br><br>Windows 11 · C++ · CEF<br>RU / EN · Профили · Приватность</div>':`<div class="sl-tiles">${c[5].map(v=>`<div class="sl-tile">${esc(v)}<small>${esc(c[0])}</small></div>`).join('')}</div>`}</div>`;
  }
  function renderSide(){const side=$('.sl-sidebar');side.innerHTML='<header>Вкладки</header>'+[...tabs.filter(t=>t.pin),...tabs.filter(t=>!t.pin)].map(t=>`<div class="sl-side-row ${t.id===active?'is-active':''}"><button class="sl-side-switch cursor-interaction" data-switch="${t.id}">${fav(t)}<span>${esc(t.title)}</span></button><button class="sl-icon cursor-interaction ${t.pin?'is-pinned':''}" data-pin="${t.id}" aria-label="${t.pin?'Открепить':'Закрепить'} ${esc(t.title)}">${icon(t.pin?'pin-off':'pin')}</button></div>`).join('')}
  function render(){const t=current();$('.sl-pins').innerHTML=tabs.filter(x=>x.pin).map(x=>`<button class="sl-pin cursor-interaction" role="tab" aria-selected="${x.id===active}" aria-label="${esc(x.title)} — закреплена" data-tooltip="${esc(x.title)}" data-id="${x.id}" data-switch="${x.id}">${fav(x)}</button>`).join('');
    $('.sl-tabs').innerHTML=tabs.filter(x=>!x.pin).map(x=>`<div class="sl-tab" data-id="${x.id}" aria-selected="${x.id===active}" draggable="true">${fav(x)}<span class="sl-tab-label">${esc(x.title)}</span><button class="sl-tab-select cursor-interaction" role="tab" aria-selected="${x.id===active}" aria-label="${esc(x.title)}" data-tooltip="${esc(x.title)}" data-switch="${x.id}"></button><button class="sl-close cursor-interaction" data-close="${x.id}" aria-label="Закрыть ${esc(x.title)}">${icon('x')}</button></div>`).join('');
    $('.sl-page').innerHTML=page(t);$('.sl-address input').value=t.url;$('.sl-star').setAttribute('aria-pressed',String(favorites.has(t.url)));$('[data-command=back]').disabled=!t.history||!t.position;$('[data-command=forward]').disabled=!t.history||t.position>=t.history.length-1;renderSide();$('[data-command=sidebar]').setAttribute('aria-expanded',String(!$('.sl-sidebar').hidden));$('[data-command=overview]').setAttribute('aria-expanded',String(!$('.sl-overview').hidden));refreshIcons();if(lastRenderedActive!==active){lastRenderedActive=active;requestAnimationFrame(()=>root.querySelector(`[data-id="${active}"]`)?.scrollIntoView({block:'nearest',inline:'nearest'}))}
    const search=$('.sl-search');if(search)search.addEventListener('submit',e=>{e.preventDefault();navigate(search.querySelector('input').value)})
  }
  function menu(id,position){contextId=id;const t=tabs.find(x=>x.id===id);const m=$('.sl-menu');m.innerHTML=`<button class="cursor-interaction" role="menuitem" data-menu="pin">${icon(t.pin?'pin-off':'pin')}${t.pin?'Открепить вкладку':'Закрепить вкладку'}</button><button class="cursor-interaction" role="menuitem" data-menu="duplicate">${icon('copy')}Дублировать</button><hr><button class="cursor-interaction" role="menuitem" data-menu="theme">${icon('sun-moon')}Сменить тему</button><button class="cursor-interaction" role="menuitem" data-menu="close">${icon('x')}Закрыть вкладку</button>`;m.hidden=false;const r=root.getBoundingClientRect();m.style.left=Math.max(6,Math.min(position?.x??r.width/2-110,r.width-226))+'px';m.style.top=(position?.y??43)+'px';$('[data-command=menu]').setAttribute('aria-expanded','true');refreshIcons()}
  root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el){if(!e.target.closest('.sl-menu'))closeMenu();return}if(el.dataset.switch){select(+el.dataset.switch);return}if(el.dataset.close){closeTab(+el.dataset.close);return}if(el.dataset.pin){pin(+el.dataset.pin);return}if(el.dataset.menu){const action=el.dataset.menu;if(action==='pin')pin(contextId);if(action==='close')closeTab(contextId);if(action==='theme')theme();if(action==='duplicate'){const t=tabs.find(t=>t.id===contextId);tabs.push({...t,id:nextId++,pin:false,history:undefined});select(nextId-1)}return}
    switch(el.dataset.command){case'new':newTab();break;case'theme':theme();break;case'back':travel(-1);break;case'forward':travel(1);break;case'favorite':{const t=current();favorites.has(t.url)?favorites.delete(t.url):favorites.add(t.url);el.setAttribute('aria-pressed',String(favorites.has(t.url)));notify(favorites.has(t.url)?'Добавлено в избранное':'Удалено из избранного');break}case'reload':el.classList.remove('sl-reloading');void el.offsetWidth;el.classList.add('sl-reloading');notify('Демонстрационная страница обновлена');break;case'menu':if($('.sl-menu').hidden)menu(active);else closeMenu();break;case'sidebar':{const side=$('.sl-sidebar');side.hidden=!side.hidden;$('.sl-overview').hidden=true;el.setAttribute('aria-expanded',String(!side.hidden));closeMenu();break}case'overview':{const overview=$('.sl-overview');if(!overview.hidden){overview.hidden=true;break}$('.sl-sidebar').hidden=true;overview.innerHTML=`<header><span>Обзор вкладок</span><button class="sl-icon cursor-interaction" data-command="overview" aria-label="Закрыть обзор">${icon('x')}</button></header><div class="sl-overview-grid">${tabs.map(t=>`<button class="sl-overview-item cursor-interaction" data-switch="${t.id}" aria-current="${t.id===active}">${fav(t)}<span>${esc(t.title)}${t.pin?' · закреплена':''}</span></button>`).join('')}</div>`;overview.hidden=false;closeMenu();refreshIcons();break}}
  });
  root.addEventListener('contextmenu',e=>{const tab=e.target.closest('[data-id]');if(!tab)return;e.preventDefault();const r=root.getBoundingClientRect();menu(+tab.dataset.id,{x:e.clientX-r.left,y:Math.min(e.clientY-r.top,root.clientHeight-220)})});
  root.addEventListener('dragstart',e=>{const tab=e.target.closest('.sl-tab');if(tab){dragId=+tab.dataset.id;e.dataTransfer.setData('text/plain',String(dragId))}});
  root.addEventListener('dragover',e=>{if(e.target.closest('.sl-tab'))e.preventDefault()});
  root.addEventListener('drop',e=>{const tab=e.target.closest('.sl-tab');if(!tab||dragId==null)return;e.preventDefault();const from=tabs.findIndex(t=>t.id===dragId),to=tabs.findIndex(t=>t.id===+tab.dataset.id);if(from>=0&&to>=0){const [item]=tabs.splice(from,1);tabs.splice(to,0,item);render()}dragId=null});
  $('.sl-address').addEventListener('submit',e=>{e.preventDefault();navigate($('.sl-address input').value);$('.sl-address input').blur()});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();$('.sl-sidebar').hidden=true;$('.sl-overview').hidden=true}if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();$('.sl-address input').focus();$('.sl-address input').select()}});
  render();
})();
</script>
