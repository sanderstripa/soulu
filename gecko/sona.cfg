// Sona Gecko Preview 3 — local application chrome; never loaded into website globals.
(() => {
  const Services = globalThis.Services;
  Services.prefs.getDefaultBranch('').setBoolPref('browser.shell.checkDefaultBrowser',false);
  Services.prefs.lockPref('browser.shell.checkDefaultBrowser');
  Services.prefs.getDefaultBranch('').setBoolPref('browser.startup.preXulSkeletonUI',false);
  Services.prefs.lockPref('browser.startup.preXulSkeletonUI');
  Services.prefs.getDefaultBranch('').setBoolPref('browser.startup.blankWindow',false);Services.prefs.lockPref('browser.startup.blankWindow');
  Services.prefs.setBoolPref('widget.windows.mica',false);Services.prefs.lockPref('widget.windows.mica');
  Services.prefs.getDefaultBranch('').setBoolPref('browser.privateWindowSeparation.enabled',false);Services.prefs.lockPref('browser.privateWindowSeparation.enabled');
  const app = Services.dirsvc.get('GreD', Ci.nsIFile);
  const manifest = app.clone(); manifest.append('sona'); manifest.append('chrome.manifest');
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
  const vot=app.clone();for(const part of ['sona','optional','vot-1.12.6.xpi'])vot.append(part);if(vot.exists())Services.io.getProtocolHandler('resource').QueryInterface(Ci.nsIResProtocolHandler).setSubstitution('sona-vot',Services.io.newURI('jar:'+Services.io.newFileURI(vot).spec+'!/'));
  const sheets=Cc['@mozilla.org/content/style-sheet-service;1'].getService(Ci.nsIStyleSheetService);
  const early=Services.io.newURI('chrome://sona/content/early.css');if(!sheets.sheetRegistered(early,sheets.USER_SHEET))sheets.loadAndRegisterSheet(early,sheets.USER_SHEET);
  // Application documents use file: URLs. Keep all extension injection away
  // from local files, including add-ons explicitly granted file access.
  // This native guard is established before user extensions start and is
  // propagated by Gecko to their content processes. It does not alter Firefox
  // sandboxing, signatures or the permissions granted on ordinary websites.
  const {setEnterpriseGuards}=ChromeUtils.importESModule('resource://gre/modules/ExtensionPermissions.sys.mjs');
  try{setEnterpriseGuards({'*':{runtime_blocked_hosts:['file:///*'],runtime_allowed_hosts:[]}});}catch(error){console.error('Soul extension guard',error);}
  const ui=app.clone();for(const part of ['sona','chrome','ui'])ui.append(part);const prefix=Services.io.newFileURI(ui).spec.replace(/\/?$/,'/');
  ChromeUtils.registerWindowActor('SonaApp',{parent:{esModuleURI:'chrome://sona/content/AppParent.sys.mjs'},child:{esModuleURI:'chrome://sona/content/AppChild.sys.mjs',events:{SonaRequest:{capture:true,wantUntrusted:true},keydown:{capture:true},mousedown:{capture:true}}},includeChrome:true,remoteTypes:['file'],safeForUntrustedWebProcess:true,allFrames:true,matches:['index.html','home.html','settings.html','history.html','onboarding.html'].map(p=>prefix+p+'*')});
  Services.prefs.getDefaultBranch('').setStringPref('browser.startup.homepage',prefix+'home.html');
  ChromeUtils.registerWindowActor('SonaAddons',{child:{esModuleURI:'chrome://sona/content/AddonsChild.sys.mjs',events:{DOMContentLoaded:{capture:true},pageshow:{capture:true}}},matches:['about:addons'],allFrames:false});
  const createShell=win=>{if(!win.document.getElementById('sona-shell-frame')){const frame=win.document.createXULElement('browser');frame.id='sona-shell-frame';for(const [key,value] of Object.entries({type:'content',remote:'true',remoteType:'file',disablehistory:'true',transparent:'true',src:prefix+'index.html'}))frame.setAttribute(key,value);win.document.documentElement.append(frame);}};
  const observer = { observe(win) {
    win.__sonaStartupEvents=[];
    const beforeLayout=()=>{win.__sonaStartupEvents.push({uri:win.document.documentURI,at:Date.now()});if(win.document.documentURI==='chrome://browser/content/browser.xhtml'){win.removeEventListener('MozBeforeInitialXULLayout',beforeLayout);ChromeUtils.importESModule('chrome://sona/content/window-controls.sys.mjs').prepareStartup(win);createShell(win);}};win.addEventListener('MozBeforeInitialXULLayout',beforeLayout);
    win.addEventListener('DOMContentLoaded',()=>{if(win.document.documentURI==='chrome://browser/content/browser.xhtml'){try{const registry=win.L10nRegistry.getInstance();if(!registry.hasSource('sona-branding'))registry.registerSources([new win.L10nFileSource('sona-branding','app',['ru','en-US'],'chrome://sona/content/locales/{locale}/')]);}catch(error){console.error('Sona branding',error);}
ChromeUtils.importESModule('chrome://sona/content/window-controls.sys.mjs').prepareStartup(win);createShell(win);
win.setTimeout(()=>{if(win.gBrowserInit?.domContentLoaded&&!win.Sona)Services.scriptloader.loadSubScript('chrome://sona/content/browser.js',win);},0);
win.__sonaEarlyDisplay=win.getComputedStyle(win.document.getElementById('navigator-toolbox')).display;try{ChromeUtils.importESModule('chrome://sona/content/window-controls.sys.mjs').brand(win);}catch(error){console.error(error);}}},{once:true});
    win.addEventListener('load', () => {
      if(win.document.documentURI.startsWith('chrome://browser/content/migration/')){try{ChromeUtils.importESModule('chrome://sona/content/window-controls.sys.mjs').brand(win);win.document.title='Импорт данных — Sona';const icon=win.document.querySelector('link[rel=icon]');if(icon)icon.href='chrome://sona/content/ui/branding/sona-128.png';}catch(error){console.error(error);}}
      if (win.document.documentURI !== 'chrome://browser/content/browser.xhtml') return;
      Services.scriptloader.loadSubScript('chrome://sona/content/browser.js', win);
    }, {once:true});
  }};
  Services.obs.addObserver(observer, 'domwindowopened');
})();
