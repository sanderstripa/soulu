// Soulu Gecko Preview 3 — local application chrome; never loaded into website globals.
(() => {
  const Services = globalThis.Services;
  Services.prefs.getDefaultBranch('').setBoolPref('browser.shell.checkDefaultBrowser',false);
  Services.prefs.lockPref('browser.shell.checkDefaultBrowser');
  Services.prefs.getDefaultBranch('').setBoolPref('browser.startup.preXulSkeletonUI',false);
  Services.prefs.lockPref('browser.startup.preXulSkeletonUI');
  Services.prefs.getDefaultBranch('').setBoolPref('browser.startup.blankWindow',false);Services.prefs.lockPref('browser.startup.blankWindow');
  Services.prefs.setBoolPref('widget.windows.mica',false);Services.prefs.lockPref('widget.windows.mica');
  const app = Services.dirsvc.get('GreD', Ci.nsIFile);
  const manifest = app.clone(); manifest.append('soulu'); manifest.append('chrome.manifest');
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
  const vot=app.clone();for(const part of ['soulu','optional','vot-1.12.6.xpi'])vot.append(part);if(vot.exists())Services.io.getProtocolHandler('resource').QueryInterface(Ci.nsIResProtocolHandler).setSubstitution('soulu-vot',Services.io.newURI('jar:'+Services.io.newFileURI(vot).spec+'!/'));
  const sheets=Cc['@mozilla.org/content/style-sheet-service;1'].getService(Ci.nsIStyleSheetService);
  const early=Services.io.newURI('chrome://soulu/content/early.css');if(!sheets.sheetRegistered(early,sheets.USER_SHEET))sheets.loadAndRegisterSheet(early,sheets.USER_SHEET);
  // Application documents use file: URLs. Keep all extension injection away
  // from local files, including add-ons explicitly granted file access.
  // This native guard is established before user extensions start and is
  // propagated by Gecko to their content processes. It does not alter Firefox
  // sandboxing, signatures or the permissions granted on ordinary websites.
  const {setEnterpriseGuards}=ChromeUtils.importESModule('resource://gre/modules/ExtensionPermissions.sys.mjs');
  setEnterpriseGuards({'*':{runtime_blocked_hosts:['file:///*'],runtime_allowed_hosts:[]}});
  const ui=app.clone();for(const part of ['soulu','chrome','ui'])ui.append(part);const prefix=Services.io.newFileURI(ui).spec.replace(/\/?$/,'/');
  ChromeUtils.registerWindowActor('SouluApp',{parent:{esModuleURI:'chrome://soulu/content/AppParent.sys.mjs'},child:{esModuleURI:'chrome://soulu/content/AppChild.sys.mjs',events:{SouluRequest:{capture:true,wantUntrusted:true},keydown:{capture:true},mousedown:{capture:true}}},includeChrome:true,remoteTypes:['file'],safeForUntrustedWebProcess:true,allFrames:true,matches:['index.html','home.html','settings.html','history.html','onboarding.html'].map(p=>prefix+p+'*')});
  Services.prefs.getDefaultBranch('').setStringPref('browser.startup.homepage',prefix+'home.html');
  ChromeUtils.registerWindowActor('SouluAddons',{child:{esModuleURI:'chrome://soulu/content/AddonsChild.sys.mjs',events:{DOMContentLoaded:{capture:true},pageshow:{capture:true}}},matches:['about:addons'],allFrames:false});
  const createShell=win=>{if(!win.document.getElementById('soulu-shell-frame')){const frame=win.document.createXULElement('browser');frame.id='soulu-shell-frame';for(const [key,value] of Object.entries({type:'content',remote:'true',remoteType:'file',disablehistory:'true',transparent:'true',src:prefix+'index.html'}))frame.setAttribute(key,value);win.document.documentElement.append(frame);}};
  const observer = { observe(win) {
    win.__souluStartupEvents=[];
    const beforeLayout=()=>{win.__souluStartupEvents.push({uri:win.document.documentURI,at:Date.now()});if(win.document.documentURI==='chrome://browser/content/browser.xhtml'){win.removeEventListener('MozBeforeInitialXULLayout',beforeLayout);ChromeUtils.importESModule('chrome://soulu/content/window-controls.sys.mjs').prepareStartup(win);createShell(win);}};win.addEventListener('MozBeforeInitialXULLayout',beforeLayout);
    win.addEventListener('DOMContentLoaded',()=>{if(win.document.documentURI==='chrome://browser/content/browser.xhtml'){try{const registry=win.L10nRegistry.getInstance();if(!registry.hasSource('soulu-branding'))registry.registerSources([new win.L10nFileSource('soulu-branding','app',['ru','en-US'],'chrome://soulu/content/locales/{locale}/')]);}catch(error){console.error('Soulu branding',error);}
ChromeUtils.importESModule('chrome://soulu/content/window-controls.sys.mjs').prepareStartup(win);createShell(win);
win.setTimeout(()=>{if(win.gBrowserInit?.domContentLoaded&&!win.Soulu)Services.scriptloader.loadSubScript('chrome://soulu/content/browser.js',win);},0);
win.__souluEarlyDisplay=win.getComputedStyle(win.document.getElementById('navigator-toolbox')).display;try{ChromeUtils.importESModule('chrome://soulu/content/window-controls.sys.mjs').brand(win);}catch(error){console.error(error);}}},{once:true});
    win.addEventListener('load', () => {
      if(win.document.documentURI.startsWith('chrome://browser/content/migration/')){try{ChromeUtils.importESModule('chrome://soulu/content/window-controls.sys.mjs').brand(win);win.document.title='Импорт данных — Soulu';const icon=win.document.querySelector('link[rel=icon]');if(icon)icon.href='chrome://soulu/content/ui/branding/soulu-128.png';}catch(error){console.error(error);}}
      if (win.document.documentURI !== 'chrome://browser/content/browser.xhtml') return;
      Services.scriptloader.loadSubScript('chrome://soulu/content/browser.js', win);
    }, {once:true});
  }};
  Services.obs.addObserver(observer, 'domwindowopened');
  // Preview 9: Firefox shell integration and its default-browser agent register
  // "Mozilla Firefox" Start-menu and URL class entries that point inside this
  // Soulu installation, so the OS shows a second, uninvited browser. Remove only
  // the stale registrations whose open command lives under this install root;
  // a real, separately installed Firefox is never touched.
  if (Services.appinfo.OS === 'WINNT') try {
    const installRoot = Services.dirsvc.get('GreD', Ci.nsIFile).parent.path.toLowerCase();
    const openKey = (path, mode) => { const key = Cc['@mozilla.org/windows-registry-key;1'].createInstance(Ci.nsIWindowsRegKey); key.open(Ci.nsIWindowsRegKey.ROOT_KEY_CURRENT_USER, path, mode); return key; };
    const commandOf = path => { let key; try { key = openKey(path + '\\shell\\open\\command', Ci.nsIWindowsRegKey.ACCESS_READ); return key.readStringValue('').toLowerCase(); } catch { return ''; } finally { key?.close(); } };
    const removeChild = (path, name) => { let key; try { key = openKey(path, Ci.nsIWindowsRegKey.ACCESS_READ | Ci.nsIWindowsRegKey.ACCESS_WRITE); key.removeChild(name); } catch {} finally { key?.close(); } };
    const removeValue = (path, name) => { let key; try { key = openKey(path, Ci.nsIWindowsRegKey.ACCESS_READ | Ci.nsIWindowsRegKey.ACCESS_WRITE); key.removeValue(name); } catch {} finally { key?.close(); } };
    let parent; try { parent = openKey('Software\\Clients\\StartMenuInternet', Ci.nsIWindowsRegKey.ACCESS_READ); const stale = []; for (let i = 0; i < parent.childCount; i++) { const name = parent.getChildName(i); if (!/^firefox/i.test(name)) continue; const command = commandOf('Software\\Clients\\StartMenuInternet\\' + name); if (command && command.includes(installRoot)) stale.push(name); } for (const name of stale) { removeChild('Software\\Clients\\StartMenuInternet', name); removeValue('Software\\RegisteredApplications', name); } } catch {} finally { parent?.close(); }
    let classes; try { classes = openKey('Software\\Classes', Ci.nsIWindowsRegKey.ACCESS_READ); const stale = []; for (let i = 0; i < classes.childCount; i++) { const name = classes.getChildName(i); if (!/^firefox(html|url)-/i.test(name)) continue; const command = commandOf('Software\\Classes\\' + name); if (command && command.includes(installRoot)) stale.push(name); } for (const name of stale) removeChild('Software\\Classes', name); } catch {} finally { classes?.close(); }
  } catch (error) { console.error('Soulu shell registration cleanup', String(error)); }
})();
